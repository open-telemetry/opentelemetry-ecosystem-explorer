- name: awslogsencodingextension
  subtype: encoding
  metadata:
    deprecated_type: awslogs_encoding
    description: This extension unmarshalls logs encoded in formats produced by AWS
      services.
    display_name: AWS Logs Encoding Extension
    feature_gates:
    - description: When enabled, CloudTrail log userIdentity attributes will use 'aws.user_identity'
        prefix. This helps to preserve the attribute origin.
      from_version: v0.145.0
      id: extension.awslogsencoding.cloudtrail.enable.user.identity.prefix
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/45459
      stage: alpha
    - description: When enabled, aws.vpc.flow.start field will be formatted as ISO-8601
        string instead of seconds since epoch integer.
      from_version: v0.138.0
      id: extension.awslogsencoding.vpcflow.start.iso8601
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/43390
      stage: alpha
    - description: When enabled, CloudTrail log unmarshaler no longer emits the deprecated
        semconv v1.38.0 attributes rpc.service and rpc.system. Requires extension.encoding.awslogsencoding.EmitV1RPCConventions
        to also be enabled.
      from_version: v0.150.0
      id: extension.encoding.awslogsencoding.DontEmitV0RPCConventions
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47549
      stage: alpha
    - description: When enabled, CloudTrail log unmarshaler emits rpc.system.name
        (semconv v1.40.0) instead of the deprecated rpc.system (semconv v1.38.0).
      from_version: v0.150.0
      id: extension.encoding.awslogsencoding.EmitV1RPCConventions
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47549
      stage: beta
    status:
      class: extension
      codeowners:
        active:
        - constanca-m
        - Kavindu-Dodan
        - MichaelKatsoulis
        emeritus:
        - axw
      distributions:
      - contrib
      stability:
        alpha:
        - extension
    type: aws_logs_encoding
- name: azureencodingextension
  subtype: encoding
  metadata:
    description: This extension is designed for unmarshaling logs/traces/metrics encoded
      in specific format produced by [Azure Diagnostic Settings Export](https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings)
      or [Azure Data Collection Rules (DCRs)](https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-rule-overview)
    display_name: Azure Logs/Traces/Metrics Encoding Extension
    feature_gates:
    - description: When enabled, v0 semconv log attribute names are not emitted.
      from_version: v0.149.0
      id: extension.azureencoding.DontEmitV0LogConventions
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47543
      stage: alpha
    - description: When enabled, v1 semconv log attribute names are emitted.
      from_version: v0.149.0
      id: extension.azureencoding.EmitV1LogConventions
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47543
      stage: alpha
    status:
      class: extension
      codeowners:
        active:
        - constanca-m
        emeritus:
        - axw
      distributions:
      - contrib
      stability:
        alpha:
        - extension
    type: azure_encoding
