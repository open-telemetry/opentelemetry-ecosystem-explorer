      ntp.frequency.offset:
        attributes:
        - leap.status
        description: The frequency is the rate by which the system s clock would be
          wrong if chronyd was not correcting it.
        enabled: false
        extended_documentation: It is expressed in ppm (parts per million). For example,
          a value of 1 ppm would mean that when the system’s clock thinks it has advanced
          1 second, it has actually advanced by 1.000001 seconds relative to true
          time.
        gauge:
          value_type: double
        stability: development
        unit: ppm
      ntp.skew:
        description: This is the estimated error bound on the frequency.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: ppm
      ntp.stratum:
        description: The number of hops away from the reference system keeping the
          reference time
        enabled: false
        extended_documentation: To read further, refer to https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/7/html/system_administrators_guide/ch-configuring_ntp_using_the_chrony_suite#sect-Checking_chrony_tracking
        gauge:
          value_type: int
        stability: development
        unit: '{count}'
      ntp.time.correction:
        attributes:
        - leap.status
        description: The number of seconds difference between the system's clock and
          the reference clock
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: seconds
      ntp.time.last_offset:
        attributes:
        - leap.status
        description: The estimated local offset on the last clock update
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: seconds
      ntp.time.rms_offset:
        attributes:
        - leap.status
        description: the long term average of the offset value
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: seconds
      ntp.time.root_delay:
        attributes:
        - leap.status
        description: This is the total of the network path delays to the stratum-1
          system from which the system is ultimately synchronised.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: seconds
    reaggregation_enabled: true
    status:
      class: receiver
      codeowners:
        active:
        - MovieStoreGuy
        - jamesmoessis
      distributions:
      - contrib
      stability:
        beta:
        - metrics
    type: chrony
- name: ciscoosreceiver
  metadata:
    deprecated_type: ciscoos
    description: The Cisco OS Receiver is a modular receiver that collects metrics
      from Cisco network devices via SSH connections. It supports multiple scrapers
      for comprehensive network monitoring and provides native OpenTelemetry OTLP
      metrics generation.
    display_name: Cisco OS Receiver
    status:
      class: receiver
      codeowners:
        active:
        - dmitryax
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
    type: cisco_os
- name: cloudflarereceiver
  metadata:
    description: The Cloudflare Receiver allows Cloudflare's [LogPush Jobs](https://developers.cloudflare.com/logs/logpush/)
      to send logs over HTTPS from the Cloudflare logs aggregation system to an OpenTelemetry
      collector.
    display_name: Cloudflare Receiver
    status:
      class: receiver
      codeowners:
        active:
        - dehaansa
        seeking_new: true
      distributions:
      - contrib
      stability:
        alpha:
        - logs
    type: cloudflare
- name: cloudfoundryreceiver
  metadata:
    deprecated_type: cloudfoundry
    description: The Cloud Foundry Receiver connects to the RLP (Reverse Log Proxy)
      Gateway of the Cloud Foundry installation, typically available at the URL `https://log-stream.<cf-system-domain>`.
    display_name: Cloud Foundry Receiver
    feature_gates:
    - description: When enabled, envelope tags are copied to the metrics as resource
        attributes instead of datapoint attributes
      from_version: v0.117.0
      id: cloudfoundry.resourceAttributes.allow
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/34824
      skip_strict_validation: true
      stage: beta
    status:
      class: receiver
      codeowners:
        active:
        - crobert-1
        emeritus:
        - agoallikmaa
        - pellared
        seeking_new: true
      distributions:
      - contrib
      stability:
        beta:
        - metrics
        development:
        - logs
    type: cloud_foundry
- name: collectdreceiver
  metadata:
    description: This receiver can receive data exported by the CollectD's `write_http`
      plugin. Only JSON format is supported. Authentication is not supported at this
      time.
    display_name: CollectD `write_http` plugin JSON receiver
    status:
      class: receiver
      codeowners:
        active:
        - atoulme
        seeking_new: true
      distributions:
      - contrib
      stability:
        beta:
        - metrics
    type: collectd
- name: couchdbreceiver
  metadata:
    attributes:
      http.method:
        description: An HTTP request method.
        enum:
        - COPY
        - DELETE
        - GET
        - HEAD
        - OPTIONS
        - POST
        - PUT
        requirement_level: recommended
        type: string
      http.status_code:
        description: An HTTP status code.
        requirement_level: recommended
        type: string
      operation:
        description: The operation type.
        enum:
        - reads
        - writes
        requirement_level: recommended
        type: string
      view:
        description: The view type.
        enum:
        - temporary_view_reads
        - view_reads
        requirement_level: recommended
        type: string
    description: This receiver fetches stats from a CouchDB server using the `/_node/{node-name}/_stats/couchdb`
      [endpoint](https://docs.couchdb.org/en/latest/api/server/common.html#node-node-name-stats).
    display_name: CouchDB Receiver
    metrics:
      couchdb.average_request_time:
        description: The average duration of a served request.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: ms
      couchdb.database.open:
        description: The number of open databases.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{databases}'
      couchdb.database.operations:
        attributes:
        - operation
        description: The number of database operations.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      couchdb.file_descriptor.open:
        description: The number of open file descriptors.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{files}'
      couchdb.httpd.bulk_requests:
        description: The number of bulk requests.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{requests}'
      couchdb.httpd.requests:
        attributes:
        - http.method
        description: The number of HTTP requests by method.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{requests}'
      couchdb.httpd.responses:
        attributes:
        - http.status_code
        description: The number of each HTTP status code.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{responses}'
      couchdb.httpd.views:
        attributes:
        - view
        description: The number of views read.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{views}'
    reaggregation_enabled: true
    resource_attributes:
      couchdb.node.name:
        description: The name of the node.
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - antonblock
        emeritus:
        - djaglowski
        seeking_new: true
      distributions:
      - contrib
      stability:
        beta:
        - metrics
    type: couchdb
- name: datadogreceiver
  metadata:
    description: The Datadog receiver enables translation between Datadog and OpenTelemetry-compatible
      backends. It currently has support for Datadog's APM traces, metrics, and logs.
    display_name: Datadog Receiver
    status:
      class: receiver
      codeowners:
        active:
        - boostchicken
        - MovieStoreGuy
        emeritus:
        - gouthamve
      distributions:
      - contrib
      stability:
        alpha:
        - logs
        - metrics
        - traces
    type: datadog
- name: dockerstatsreceiver
  metadata:
    attributes:
      core:
        description: The CPU core number when utilising per-CPU metrics.
        requirement_level: recommended
        type: string
      device_major:
        description: Device major number for block IO operations.
        requirement_level: recommended
        type: string
      device_minor:
        description: Device minor number for block IO operations.
        requirement_level: recommended
        type: string
      interface:
        description: Network interface.
        requirement_level: recommended
        type: string
      operation:
        description: Type of BlockIO operation.
        requirement_level: recommended
        type: string
    description: The Docker Stats receiver queries the local Docker daemon's container
      stats API for all desired running containers on a configured interval. These
      stats are for container resource usage of cpu, memory, network, and the [blkio
      controller](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).
    display_name: Docker Stats Receiver
    metrics:
      container.blockio.io_merged_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Number of bios/requests merged into requests belonging to this
          cgroup and its descendant cgroups (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.blockio.io_queued_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Number of requests queued up for this cgroup and its descendant
          cgroups (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.blockio.io_service_bytes_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Number of bytes transferred to/from the disk by the group and
          descendant groups.
        enabled: true
        extended_documentation: More docs for [cgroups v1](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt)
          and [cgroups v2](https://www.kernel.org/doc/Documentation/cgroup-v2.txt)
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      container.blockio.io_service_time_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Total amount of time in nanoseconds between request dispatch
          and request completion for the IOs done by this cgroup and descendant cgroups
          (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.blockio.io_serviced_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Number of IOs (bio) issued to the disk by the group and descendant
          groups (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.blockio.io_time_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Disk time allocated to cgroup (and descendant cgroups) per device
          in milliseconds (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ms
      container.blockio.io_wait_time_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Total amount of time the IOs for this cgroup (and descendant
          cgroups) spent waiting in the scheduler queues for service (Only available
          with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.blockio.sectors_recursive:
        attributes:
        - device_major
        - device_minor
        - operation
        description: Number of sectors transferred to/from disk by the group and descendant
          groups (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{sectors}'
      container.cpu.limit:
        description: CPU limit set for the container.
        enabled: false
        extended_documentation: This metric is only reported if the container has
          limits set with -cpus, -cpuset-cpus or -cpu-quota.
        gauge:
          value_type: double
        stability: development
        unit: '{cpus}'
      container.cpu.logical.count:
        description: Number of cores available to the container.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{cpus}'
      container.cpu.shares:
        description: CPU shares set for the container.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '1'
      container.cpu.throttling_data.periods:
        description: Number of periods with throttling active.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{periods}'
      container.cpu.throttling_data.throttled_periods:
        description: Number of periods when the container hits its throttling limit.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{periods}'
      container.cpu.throttling_data.throttled_time:
        description: Aggregate time the container was throttled.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.cpu.usage.kernelmode:
        description: Time spent by tasks of the cgroup in kernel mode (Linux). Time
          spent by all container processes in kernel mode (Windows).
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.cpu.usage.percpu:
        attributes:
        - core
        description: Per-core CPU usage by the container (Only available with cgroups
          v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.cpu.usage.system:
        description: System CPU usage, as reported by docker.
        enabled: false
        extended_documentation: Note this is the usage for the system, not the container.
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.cpu.usage.total:
        description: Total CPU time consumed.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.cpu.usage.usermode:
        description: Time spent by tasks of the cgroup in user mode (Linux). Time
          spent by all container processes in user mode (Windows).
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ns
      container.cpu.utilization:
        description: Percent of CPU used by the container.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: '1'
      container.memory.active_anon:
        description: The amount of anonymous memory that has been identified as active
          by the kernel.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.active_file:
        description: Cache memory that has been identified as active by the kernel.
        enabled: false
        extended_documentation: '[More docs](https://docs.docker.com/config/containers/runmetrics/)'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.anon:
        description: Amount of memory used in anonymous mappings such as brk(), sbrk(),
          and mmap(MAP_ANONYMOUS) (Only available with cgroups v2).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v2.txt)'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.cache:
        description: The amount of memory used by the processes of this control group
          that can be associated precisely with a block on a block device (Only available
          with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.dirty:
        description: Bytes that are waiting to get written back to the disk, from
          this cgroup (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.fails:
        description: Number of times the memory limit was hit.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{fails}'
      container.memory.file:
        description: Amount of memory used to cache filesystem data, including tmpfs
          and shared memory (Only available with cgroups v2).
        enabled: true
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v2.txt)'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.hierarchical_memory_limit:
        description: The maximum amount of physical memory that can be used by the
          processes of this control group (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.hierarchical_memsw_limit:
        description: The maximum amount of RAM + swap that can be used by the processes
          of this control group (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.inactive_anon:
        description: The amount of anonymous memory that has been identified as inactive
          by the kernel.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.inactive_file:
        description: Cache memory that has been identified as inactive by the kernel.
        enabled: false
        extended_documentation: '[More docs](https://docs.docker.com/config/containers/runmetrics/)'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.mapped_file:
        description: Indicates the amount of memory mapped by the processes in the
          control group (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.percent:
        description: Percentage of memory used. Not supported on Windows.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: '1'
      container.memory.pgfault:
        description: Indicate the number of times that a process of the cgroup triggered
          a page fault.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{faults}'
      container.memory.pgmajfault:
        description: Indicate the number of times that a process of the cgroup triggered
          a major fault.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{faults}'
      container.memory.pgpgin:
        description: Number of pages read from disk by the cgroup (Only available
          with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/memory.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.memory.pgpgout:
        description: Number of pages written to disk by the cgroup (Only available
          with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/memory.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.memory.rss:
        description: 'The amount of memory that doesn’t correspond to anything on
          disk: stacks, heaps, and anonymous memory maps (Only available with cgroups
          v1).'
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.rss_huge:
        description: Number of bytes of anonymous transparent hugepages in this cgroup
          (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_active_anon:
        description: The amount of anonymous memory that has been identified as active
          by the kernel. Includes descendant cgroups (Only available with cgroups
          v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_active_file:
        description: Cache memory that has been identified as active by the kernel.
          Includes descendant cgroups (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://docs.docker.com/config/containers/runmetrics/).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_cache:
        description: Total amount of memory used by the processes of this cgroup (and
          descendants) that can be associated with a block on a block device. Also
          accounts for memory used by tmpfs (Only available with cgroups v1). Not
          supported on Windows.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_dirty:
        description: Bytes that are waiting to get written back to the disk, from
          this cgroup and descendants (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_inactive_anon:
        description: The amount of anonymous memory that has been identified as inactive
          by the kernel. Includes descendant cgroups (Only available with cgroups
          v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_inactive_file:
        description: Cache memory that has been identified as inactive by the kernel.
          Includes descendant cgroups (Only available with cgroups v1).
        enabled: false
        extended_documentation: '[More docs](https://docs.docker.com/config/containers/runmetrics/).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_mapped_file:
        description: Indicates the amount of memory mapped by the processes in the
          control group and descendant groups (Only available with cgroups v1).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.total_pgfault:
        description: Indicate the number of times that a process of the cgroup (or
          descendant cgroups) triggered a page fault (Only available with cgroups
          v1).
        enabled: false
        stability: development
        sum:
