      elasticsearch.process.cpu.usage:
        attributes: []
        description: CPU usage in percent.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '1'
      elasticsearch.process.memory.virtual:
        attributes: []
        description: Size of virtual memory that is guaranteed to be available to
          the running process.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      jvm.classes.loaded:
        attributes: []
        description: The number of loaded classes
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '1'
      jvm.gc.collections.count:
        attributes:
        - collector_name
        description: The total number of garbage collections that have occurred
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      jvm.gc.collections.elapsed:
        attributes:
        - collector_name
        description: The approximate accumulated collection elapsed time
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: ms
      jvm.memory.heap.committed:
        attributes: []
        description: The amount of memory that is guaranteed to be available for the
          heap
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      jvm.memory.heap.max:
        attributes: []
        description: The maximum amount of memory can be used for the heap
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      jvm.memory.heap.used:
        attributes: []
        description: The current heap memory usage
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      jvm.memory.heap.utilization:
        attributes: []
        description: Fraction of heap memory usage
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '1'
      jvm.memory.nonheap.committed:
        attributes: []
        description: The amount of memory that is guaranteed to be available for non-heap
          purposes
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      jvm.memory.nonheap.used:
        attributes: []
        description: The current non-heap memory usage
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      jvm.memory.pool.max:
