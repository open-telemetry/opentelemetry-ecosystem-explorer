        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      mongodb.inserts.rate:
        description: The number of insertions executed per second.
        enabled: false
        gauge:
          aggregation_temporality: delta
          monotonic: false
          value_type: double
        stability: development
        unit: '{insert}/s'
      mongodb.lock.acquire.count:
        attributes:
        - db.namespace
        - lock_mode
        - lock_type
