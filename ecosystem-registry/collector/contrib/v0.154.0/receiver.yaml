        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{connections}'
      memcached.connections.total:
        attributes: []
        description: Total number of connections opened since the server started running.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{connections}'
      memcached.cpu.usage:
        attributes:
        - state
