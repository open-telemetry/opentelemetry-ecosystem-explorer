      meant to act as a generally available receiver for any webhook style data source.
      It is designed to work alongside other pipeline components like the [transform
      processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/transformprocessor)
      to allow the ingestion of generic events as logs into the opentelemetry collector.
