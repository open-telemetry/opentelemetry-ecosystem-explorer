        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      jvm.threads.count:
        attributes: []
        description: The current number of threads
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '1'
    reaggregation_enabled: true
    resource_attributes:
