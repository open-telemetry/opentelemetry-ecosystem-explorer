- name: elasticsearchreceiver
  metadata:
    attributes:
      cache_name:
        description: The name of cache.
        enum:
        - fielddata
        - query
        requirement_level: recommended
        type: string
      circuit_breaker_name:
        description: The name of circuit breaker.
        name_override: name
        requirement_level: recommended
        type: string
      cluster_published_difference_state:
        description: State of the published differences
        enum:
        - compatible
        - incompatible
        name_override: state
        requirement_level: recommended
        type: string
      cluster_state_queue_state:
        description: State of the published differences
        enum:
        - committed
        - pending
        name_override: state
        requirement_level: recommended
        type: string
      cluster_state_update_state:
        description: State of cluster state update
        name_override: state
        requirement_level: recommended
        type: string
      cluster_state_update_type:
        description: Type of cluster state update
        enum:
        - commit
        - completion
        - computation
        - context_construction
        - master_apply
        - notification
        name_override: type
        requirement_level: recommended
        type: string
      collector_name:
        description: The name of the garbage collector.
        name_override: name
        requirement_level: recommended
        type: string
      direction:
        description: The direction of network data.
        enum:
        - received
        - sent
        requirement_level: recommended
        type: string
      document_state:
        description: The state of the document.
        enum:
        - active
        - deleted
        name_override: state
        requirement_level: recommended
        type: string
      get_result:
        description: Result of get operation
        enum:
        - hit
        - miss
        name_override: result
        requirement_level: recommended
        type: string
      health_status:
        description: The health status of the cluster.
        enum:
        - green
        - red
        - yellow
        name_override: status
        requirement_level: recommended
        type: string
      index_aggregation_type:
        description: Type of shard aggregation for index statistics
        enum:
        - primary_shards
        - total
        name_override: aggregation
        requirement_level: recommended
        type: string
      indexing_pressure_stage:
        description: Stage of the indexing pressure
        enum:
        - coordinating
        - primary
        - replica
        name_override: stage
        requirement_level: recommended
        type: string
      ingest_pipeline_name:
        description: Name of the ingest pipeline.
        name_override: name
        requirement_level: recommended
        type: string
      memory_pool_name:
        description: The name of the JVM memory pool.
        name_override: name
        requirement_level: recommended
        type: string
      memory_state:
        description: State of the memory
        enum:
        - free
        - used
        name_override: state
        requirement_level: recommended
        type: string
      operation:
        description: The type of operation.
        enum:
        - delete
        - fetch
        - flush
        - get
        - index
        - merge
        - query
        - refresh
        - scroll
        - suggest
        - warmer
        name_override: operation
        requirement_level: recommended
        type: string
      query_cache_count_type:
        description: Type of query cache count
        enum:
        - hit
        - miss
        name_override: type
        requirement_level: recommended
        type: string
      segments_memory_object_type:
        description: Type of object in segment
        enum:
        - doc_value
        - fixed_bit_set
        - index_writer
        - term
        name_override: object
        requirement_level: recommended
        type: string
      shard_state:
        description: The state of the shard.
        enum:
        - active
        - active_primary
        - initializing
        - relocating
        - unassigned
        - unassigned_delayed
        name_override: state
        requirement_level: recommended
        type: string
      task_state:
        description: The state of the task.
        enum:
        - completed
        - rejected
        name_override: state
        requirement_level: recommended
        type: string
      thread_pool_name:
        description: The name of the thread pool.
        requirement_level: recommended
        type: string
      thread_state:
        description: The state of the thread.
        enum:
        - active
        - idle
        name_override: state
        requirement_level: recommended
        type: string
    description: This receiver queries the Elasticsearch [node stats](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-nodes-stats.html),
      [cluster health](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-health.html)
      and [index stats](https://www.elastic.co/guide/en/elasticsearch/reference/current/indices-stats.html)
      endpoints in order to scrape metrics from a running Elasticsearch cluster.
    display_name: Elasticsearch Receiver
    metrics:
      elasticsearch.breaker.memory.estimated:
        attributes:
        - circuit_breaker_name
        description: Estimated memory used for the operation.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      elasticsearch.breaker.memory.limit:
        attributes:
        - circuit_breaker_name
        description: Memory limit for the circuit breaker.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      elasticsearch.breaker.tripped:
        attributes:
        - circuit_breaker_name
        description: Total number of times the circuit breaker has been triggered
          and prevented an out of memory error.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      elasticsearch.cluster.data_nodes:
        attributes: []
        description: The number of data nodes in the cluster.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{nodes}'
      elasticsearch.cluster.health:
        attributes:
        - health_status
        description: The health status of the cluster.
        enabled: true
        extended_documentation: Health status is based on the state of its primary
          and replica shards. Green indicates all shards are assigned. Yellow indicates
          that one or more replica shards are unassigned. Red indicates that one or
          more primary shards are unassigned, making some data unavailable.
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{status}'
      elasticsearch.cluster.in_flight_fetch:
