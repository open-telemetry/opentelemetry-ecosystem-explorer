        - memory_type
        description: The amount of memory used.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      mongodb.network.io.receive:
        attributes: []
        description: The number of bytes received.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      mongodb.network.io.transmit:
        attributes: []
        description: The number of by transmitted.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      mongodb.network.request.count:
        attributes: []
        description: The number of requests received by the server.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{requests}'
      mongodb.object.count:
        attributes:
        - db.namespace
        description: The number of objects.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{objects}'
      mongodb.operation.count:
        attributes:
        - operation
