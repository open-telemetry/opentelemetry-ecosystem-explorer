distribution: contrib
version: 0.154.0
repository: opentelemetry-collector-contrib
component_type: receiver
schema_hash: ed2f88264c14
components:
- name: activedirectorydsreceiver
  metadata:
    attributes:
      bind_type:
        description: The type of bind to the domain server.
        enum:
        - client
        - server
        name_override: type
        requirement_level: recommended
        type: string
      direction:
        description: The direction of data flow.
        enum:
        - received
        - sent
        requirement_level: recommended
        type: string
      network_data_type:
        description: The type of network data sent.
        enum:
        - compressed
        - uncompressed
        name_override: type
        requirement_level: recommended
        type: string
      operation_type:
        description: The type of operation.
        enum:
        - read
        - search
        - write
        name_override: type
        requirement_level: recommended
        type: string
      suboperation_type:
        description: The type of suboperation.
        enum:
        - search
        - security_descriptor_propagations_event
        name_override: type
        requirement_level: recommended
        type: string
      sync_result:
        description: The result status of the sync request.
        enum:
        - other
        - schema_mismatch
        - success
        name_override: result
        requirement_level: recommended
        type: string
      value_type:
        description: The type of value sent.
        enum:
        - distinguished_names
        - other
        name_override: type
        requirement_level: recommended
        type: string
    description: The Active Directory Domain Services Receiver scrapes metrics relating
      to an Active Directory domain controller using the Windows Performance Counters.
    display_name: Active Directory Domain Services Receiver
    metrics:
      active_directory.ds.bind.rate:
        attributes:
        - bind_type
        description: The number of binds per second serviced by this domain controller.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{binds}/s'
      active_directory.ds.ldap.bind.last_successful.time:
        description: The amount of time taken for the last successful LDAP bind.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: ms
      active_directory.ds.ldap.bind.rate:
        description: The number of successful LDAP binds per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{binds}/s'
      active_directory.ds.ldap.client.session.count:
        description: The number of connected LDAP client sessions.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{sessions}'
      active_directory.ds.ldap.search.rate:
        description: The number of LDAP searches per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{searches}/s'
      active_directory.ds.name_cache.hit_rate:
        description: The percentage of directory object name component lookups that
          are satisfied by the Directory System Agent's name cache.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: '%'
      active_directory.ds.notification.queued:
        description: The number of pending update notifications that have been queued
          to push to clients.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{notifications}'
      active_directory.ds.operation.rate:
        attributes:
        - operation_type
        description: The number of operations performed per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{operations}/s'
      active_directory.ds.replication.network.io:
        attributes:
        - direction
        - network_data_type
        description: The amount of network data transmitted by the Directory Replication
          Agent.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      active_directory.ds.replication.object.rate:
        attributes:
        - direction
        description: The number of objects transmitted by the Directory Replication
          Agent per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{objects}/s'
      active_directory.ds.replication.operation.pending:
        description: The number of pending replication operations for the Directory
          Replication Agent.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{operations}'
      active_directory.ds.replication.property.rate:
        attributes:
        - direction
        description: The number of properties transmitted by the Directory Replication
          Agent per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{properties}/s'
      active_directory.ds.replication.sync.object.pending:
        description: The number of objects remaining until the full sync completes
          for the Directory Replication Agent.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{objects}'
      active_directory.ds.replication.sync.request.count:
        attributes:
        - sync_result
        description: The number of sync requests made by the Directory Replication
          Agent.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{requests}'
      active_directory.ds.replication.value.rate:
        attributes:
        - direction
        - value_type
        description: The number of values transmitted by the Directory Replication
          Agent per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{values}/s'
      active_directory.ds.security_descriptor_propagations_event.queued:
        description: The number of security descriptor propagation events that are
          queued for processing.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{events}'
      active_directory.ds.suboperation.rate:
        attributes:
        - suboperation_type
        description: The rate of sub-operations performed.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: double
        unit: '{suboperations}/s'
      active_directory.ds.thread.count:
        description: The number of threads in use by the directory service.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{threads}'
    reaggregation_enabled: true
    status:
      class: receiver
      codeowners:
        active:
        - pjanotti
        seeking_new: true
      distributions:
      - contrib
      stability:
        beta:
        - metrics
      unsupported_platforms:
      - darwin
      - linux
    type: active_directory_ds
- name: aerospikereceiver
  metadata:
    attributes:
      connection_op:
        description: Operation performed with a connection (open or close)
        enum:
        - close
        - open
        name_override: operation
        requirement_level: recommended
        type: string
      connection_type:
        description: Type of connection to an Aerospike node
        enum:
        - client
        - fabric
        - heartbeat
        name_override: type
        requirement_level: recommended
        type: string
      index_type:
        description: Type of index the operation was performed on
        enum:
        - primary
        - secondary
        name_override: index
        requirement_level: recommended
        type: string
      namespace_component:
        description: Individual component of a namespace
        enum:
        - data
        - index
        - secondary_index
        - set_index
        name_override: component
        requirement_level: recommended
        type: string
      query_result:
        description: Result of a query operation performed on a namespace
        enum:
        - abort
        - complete
        - error
        - timeout
        name_override: result
        requirement_level: recommended
        type: string
      query_type:
        description: Type of query operation performed on a namespace
        enum:
        - aggregation
        - basic
        - long_basic
        - ops_background
        - short
        - short_basic
        - udf_background
        name_override: type
        requirement_level: recommended
        type: string
      scan_result:
        description: Result of a scan operation performed on a namespace
        enum:
        - abort
        - complete
        - error
        name_override: result
        requirement_level: recommended
        type: string
      scan_type:
        description: Type of scan operation performed on a namespace
        enum:
        - aggregation
        - basic
        - ops_background
        - udf_background
        name_override: type
        requirement_level: recommended
        type: string
      transaction_result:
        description: Result of a transaction performed on a namespace
        enum:
        - error
        - filtered_out
        - not_found
        - success
        - timeout
        name_override: result
        requirement_level: recommended
        type: string
      transaction_type:
        description: Type of transaction performed on a namespace
        enum:
        - delete
        - read
        - udf
        - write
        name_override: type
        requirement_level: recommended
        type: string
    description: The Aerospike receiver is designed to collect performance metrics
      from one or more Aerospike nodes.
    display_name: Aerospike Receiver
    metrics:
      aerospike.namespace.disk.available:
        description: Minimum percentage of contiguous disk space free to the namespace
          across all devices
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '%'
      aerospike.namespace.geojson.region_query_cells:
        description: Number of cell coverings for query region queried
        enabled: true
        extended_documentation: Number of cell coverings for query region queried.
          Aerospike metric geo_region_query_cells.
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{cells}'
      aerospike.namespace.geojson.region_query_false_positive:
        description: Number of points outside the region.
        enabled: true
        extended_documentation: Total query result points is geo_region_query_points
          + geo_region_query_falsepos. Aerospike metric geo_region_query_falsepos.
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{points}'
      aerospike.namespace.geojson.region_query_points:
        description: Number of points within the region.
        enabled: true
        extended_documentation: Total query result points is geo_region_query_points
          + geo_region_query_falsepos. Aerospike metric geo_region_query_points.
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{points}'
      aerospike.namespace.geojson.region_query_requests:
        description: Number of geojson queries on the system since the uptime of the
          node.
        enabled: true
        extended_documentation: Number of geojson queries on the system since the
          uptime of the node. Aerospike metric geo_region_query_reqs.
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{queries}'
      aerospike.namespace.memory.free:
        description: Percentage of the namespace's memory which is still free
        enabled: true
        extended_documentation: Aerospike metric memory_free_pct
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '%'
      aerospike.namespace.memory.usage:
        attributes:
        - namespace_component
        description: Memory currently used by each component of the namespace
        enabled: true
        extended_documentation: Aggregate of Aerospike Metrics memory_used_data_bytes,
          memory_used_index_bytes, memory_used_set_index_bytes, memory_used_sindex_bytes
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: false
          value_type: int
        unit: By
      aerospike.namespace.query.count:
        attributes:
        - index_type
        - query_result
        - query_type
        description: Number of query operations performed on the namespace
        enabled: true
        extended_documentation: Aggregate of Aerospike Metrics query_aggr_abort, query_aggr_complete,
          query_aggr_error, query_basic_abort, query_basic_complete, query_basic_error,
          query_ops_bg_abort, query_ops_bg_complete, query_ops_bg_error, query_udf_bg_abort,
          query_udf_bg_complete, query_udf_bg_error, pi_query_aggr_abort, pi_query_aggr_complete,
          pi_query_aggr_error, pi_query_long_basic_abort, pi_query_long_basic_complete,
          pi_query_long_basic_error, pi_query_ops_bg_abort, pi_query_ops_bg_basic_complete,
          pi_query_ops_bg_basic_error, pi_query_short_basic_timeout, pi_query_short_basic_complete,
          pi_query_short_basic_error, pi_query_udf_bg_abort, pi_query_udf_bg_complete,
          pi_query_udf_bg_error, si_query_aggr_abort, si_query_aggr_complete, si_query_aggr_error,
          si_query_long_basic_abort, si_query_long_basic_complete, si_query_long_basic_error,
          si_query_ops_bg_abort, si_query_ops_bg_basic_complete, si_query_ops_bg_basic_error,
          si_query_short_basic_timeout, si_query_short_basic_complete, si_query_short_basic_error,
          si_query_udf_bg_abort, si_query_udf_bg_complete, si_query_udf_bg_error
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{queries}'
      aerospike.namespace.scan.count:
        attributes:
        - scan_result
        - scan_type
        description: Number of scan operations performed on the namespace
        enabled: true
        extended_documentation: Aggregate of Aerospike Metrics scan_aggr_abort, scan_aggr_complete,
          scan_aggr_error, scan_basic_abort, scan_basic_complete, scan_basic_error,
          scan_ops_bg_abort, scan_ops_bg_complete, scan_ops_bg_error, scan_udf_bg_abort,
          scan_udf_bg_complete, scan_udf_bg_error
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{scans}'
      aerospike.namespace.transaction.count:
        attributes:
        - transaction_result
        - transaction_type
        description: Number of transactions performed on the namespace
        enabled: true
        extended_documentation: Aggregate of Aerospike Metrics client_delete_error,
          client_delete_filtered_out, client_delete_not_found, client_delete_success,
          client_delete_timeout, client_read_error, client_read_filtered_out, client_read_not_found,
          client_read_success, client_read_timeout, client_udf_error, client_udf_filtered_out,
          client_udf_not_found, client_udf_success, client_udf_timeout, client_write_error,
          client_write_filtered_out, client_write_not_found, client_write_success,
          client_write_timeout
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{transactions}'
      aerospike.node.connection.count:
        attributes:
        - connection_op
        - connection_type
        description: Number of connections opened and closed to the node
        enabled: true
        extended_documentation: Aggregate of Aerospike Metrics client_connections_closed,
          client_connections_opened, fabric_connections_closed, fabric_connections_opened,
          heartbeat_connections_closed, heartbeat_connections_opened
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{connections}'
      aerospike.node.connection.open:
        attributes:
        - connection_type
        description: Current number of open connections to the node
        enabled: true
        extended_documentation: Aggregate of Aerospike Metrics client_connections,
          fabric_connections, heartbeat_connections
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: false
          value_type: int
        unit: '{connections}'
      aerospike.node.memory.free:
        description: Percentage of the node's memory which is still free
        enabled: true
        extended_documentation: Aerospike Metric system_free_mem_pct
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '%'
      aerospike.node.query.tracked:
        description: Number of queries tracked by the system.
        enabled: true
        extended_documentation: Number of queries which ran more than query untracked_time
          (default 1 sec), Aerospike metric query_tracked
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{queries}'
    reaggregation_enabled: true
    resource_attributes:
      aerospike.namespace:
        description: Name of the Aerospike namespace
        enabled: true
        type: string
      aerospike.node.name:
        description: Name of the Aerospike node collected from
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - antonblock
        seeking_new: true
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
    type: aerospike
- name: apachereceiver
  metadata:
    attributes:
      connection_state:
        description: The asynchronous connection state reported by Apache's server-status.
        enum:
        - closing
        - keepalive
        - writing
        requirement_level: recommended
        type: string
      cpu_level:
        description: Level of processes.
        enum:
        - children
        - self
        name_override: level
        requirement_level: recommended
        type: string
      cpu_mode:
        description: Mode of processes.
        enum:
        - system
        - user
        name_override: mode
        requirement_level: recommended
        type: string
      scoreboard_state:
        description: The state of a connection.
        enum:
        - closing
        - dnslookup
        - finishing
        - idle_cleanup
        - keepalive
        - logging
        - open
        - reading
        - sending
        - starting
        - unknown
        - waiting
        name_override: state
        requirement_level: recommended
        type: string
      workers_state:
        description: The state of workers.
        enum:
        - busy
        - idle
        name_override: state
        requirement_level: recommended
        type: string
    description: The Apache Web Server Receiver fetches stats from an Apache Web Server
      instance using the `server-status?auto` endpoint.
    display_name: Apache Web Server Receiver
    metrics:
      apache.connections.async:
        attributes:
        - connection_state
        description: The number of connections in different asynchronous states reported
          by Apache's server-status.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{connections}'
      apache.cpu.load:
        attributes: []
        description: Current load of the CPU.
        enabled: true
        gauge:
          input_type: string
          value_type: double
        stability: development
        unit: '%'
      apache.cpu.time:
        attributes:
        - cpu_level
        - cpu_mode
        description: Jiffs used by processes of given category.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: double
        unit: '{jiff}'
      apache.current_connections:
        attributes: []
        description: The number of active connections currently attached to the HTTP
          server.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: false
          value_type: int
        unit: '{connections}'
      apache.load.1:
        attributes: []
        description: The average server load during the last minute.
        enabled: true
        gauge:
          input_type: string
          value_type: double
        stability: development
        unit: '%'
      apache.load.15:
        attributes: []
        description: The average server load during the last 15 minutes.
        enabled: true
        gauge:
          input_type: string
          value_type: double
        stability: development
        unit: '%'
      apache.load.5:
        attributes: []
        description: The average server load during the last 5 minutes.
        enabled: true
        gauge:
          input_type: string
          value_type: double
        stability: development
        unit: '%'
      apache.request.time:
        attributes: []
        description: Total time spent on handling requests.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: ms
      apache.requests:
        attributes: []
        description: The number of requests serviced by the HTTP server per second.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{requests}'
      apache.scoreboard:
        attributes:
        - scoreboard_state
        description: The number of workers in each state.
        enabled: true
        extended_documentation: The [apache scoreboard](https://metacpan.org/pod/Apache::Scoreboard#DESCRIPTION)
          is an encoded representation of the state of all the server's workers. This
          metric decodes the scoreboard and presents a count of workers in each state.
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{workers}'
      apache.traffic:
        attributes: []
        description: Total HTTP server traffic.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      apache.uptime:
        attributes: []
        description: The amount of time that the server has been running in seconds.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: s
      apache.workers:
        attributes:
        - workers_state
        description: The number of workers currently attached to the HTTP server.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: false
          value_type: int
        unit: '{workers}'
    reaggregation_enabled: true
    resource_attributes:
      apache.server.name:
        description: The name of the Apache HTTP server.
        enabled: true
        type: string
      apache.server.port:
        description: The port of the Apache HTTP server.
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - colelaven
        - ishleenk17
        emeritus:
        - djaglowski
      distributions:
      - contrib
      stability:
        beta:
        - metrics
    type: apache
- name: apachesparkreceiver
  metadata:
    attributes:
      direction:
        description: Whether the metric is in regards to input or output operations.
        enum:
        - in
        - out
        requirement_level: recommended
        type: string
      executor_task_result:
        description: The result of the executor tasks for which the metric was recorded.
        enum:
        - completed
        - failed
        name_override: result
        requirement_level: recommended
        type: string
      gc_type:
        description: The type of the garbage collection performed for the metric.
        enum:
        - major
        - minor
        requirement_level: recommended
        type: string
      job_result:
        description: The result of the job stages or tasks for which the metric was
          recorded.
        enum:
        - completed
        - failed
        - skipped
        name_override: result
        requirement_level: recommended
        type: string
      location:
        description: The location of the memory for which the metric was recorded..
        enum:
        - off_heap
        - on_heap
        requirement_level: recommended
        type: string
      pool_memory_type:
        description: The type of pool memory for which the metric was recorded.
        enum:
        - direct
        - mapped
        name_override: type
        requirement_level: recommended
        type: string
      scheduler_status:
        description: The status of the DAGScheduler stages for which the metric was
          recorded.
        enum:
        - running
        - waiting
        name_override: status
        requirement_level: recommended
        type: string
      source:
        description: The source from which data was fetched for the metric.
        enum:
        - local
        - remote
        requirement_level: recommended
        type: string
      stage_active:
        description: Whether the stage for which the metric was recorded is active.
        name_override: active
        requirement_level: recommended
        type: bool
      stage_complete:
        description: Whether the stage for which the metric was recorded is complete.
        name_override: complete
        requirement_level: recommended
        type: bool
      stage_failed:
        description: Whether the stage for which the metric was recorded is failed.
        name_override: failed
        requirement_level: recommended
        type: bool
      stage_pending:
        description: Whether the stage for which the metric was recorded is pending.
        name_override: pending
        requirement_level: recommended
        type: bool
      stage_task_result:
        description: The result of the stage tasks for which the metric was recorded.
        enum:
        - completed
        - failed
        - killed
        name_override: result
