- name: githubreceiver
  metadata:
    attributes:
      vcs.change.state:
        description: The state of a change (pull request)
        enum:
        - merged
        - open
        requirement_level: recommended
        type: string
      vcs.line_change.type:
        description: The type of line change being measured on a ref (branch).
        enum:
        - added
        - removed
        requirement_level: recommended
        type: string
      vcs.ref.base.name:
        description: The name of the VCS base reference (branch/tag) for comparison.
        requirement_level: recommended
        type: string
      vcs.ref.base.type:
        description: The type of the base reference (branch, tag).
        enum:
        - branch
        - tag
        requirement_level: recommended
        type: string
      vcs.ref.head.name:
        description: The name of the VCS head reference (branch).
        requirement_level: recommended
        type: string
      vcs.ref.head.type:
        description: The type of the head reference (branch, tag).
        enum:
        - branch
        - tag
        requirement_level: recommended
        type: string
      vcs.ref.type:
        description: The type of the reference in the repository.
        enum:
        - branch
        - tag
        requirement_level: recommended
        type: string
      vcs.repository.name:
        description: The name of the VCS repository.
        requirement_level: recommended
        type: string
      vcs.repository.url.full:
        description: The canonical URL of the repository providing the complete HTTPS
          address.
        requirement_level: recommended
        type: string
      vcs.revision_delta.direction:
        description: The type of revision comparison.
        enum:
        - ahead
        - behind
        requirement_level: recommended
        type: string
    display_name: GitHub Receiver
    feature_gates:
    - description: When enabled, deterministic job, step, and queue span IDs are derived
        from the GitHub check_run_id (the WorkflowJob.id webhook field, also exposed
        in-runner as ${{ job.check_run_id }}). Step span IDs additionally incorporate
        the step's raw name, allowing in-action telemetry tools to reproduce matching
        span IDs without calling the GitHub REST API and without knowing the runner-dependent
        step number. Payloads missing a check_run_id are rejected while this gate
        is enabled. Workflows with duplicate step names within a job will log a warning;
        duplicate steps will share the same span ID.
      from_version: v0.151.0
      id: receiver.githubreceiver.UseCheckRunID
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/44856
      skip_strict_validation: true
      stage: beta
    metrics:
      vcs.change.count:
        attributes:
        - vcs.change.state
        - vcs.repository.name
        - vcs.repository.url.full
        description: The number of changes (pull requests) in a repository, categorized
          by their state (either open or merged).
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{change}'
      vcs.change.duration:
        attributes:
        - vcs.change.state
        - vcs.ref.head.name
        - vcs.repository.name
        - vcs.repository.url.full
        description: The time duration a change (pull request/merge request/changelist)
          has been in an open state.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: s
      vcs.change.time_to_approval:
        attributes:
        - vcs.ref.head.name
        - vcs.repository.name
        - vcs.repository.url.full
        description: The amount of time it took a change (pull request) to go from
          open to approved.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: s
      vcs.change.time_to_merge:
        attributes:
        - vcs.ref.head.name
        - vcs.repository.name
        - vcs.repository.url.full
        description: The amount of time it took a change (pull request) to go from
          open to merged.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: s
      vcs.contributor.count:
        attributes:
        - vcs.repository.name
        - vcs.repository.url.full
        description: The number of unique contributors to a repository.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{contributor}'
      vcs.ref.count:
        attributes:
        - vcs.ref.type
        - vcs.repository.name
        - vcs.repository.url.full
        description: The number of refs of type branch in a repository.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{ref}'
      vcs.ref.lines_delta:
        attributes:
        - vcs.line_change.type
        - vcs.ref.base.name
        - vcs.ref.base.type
        - vcs.ref.head.name
        - vcs.ref.head.type
        - vcs.repository.name
        - vcs.repository.url.full
        description: The number of lines added/removed in a ref (branch) relative
          to the default branch (trunk).
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{line}'
      vcs.ref.revisions_delta:
        attributes:
        - vcs.ref.base.name
        - vcs.ref.base.type
        - vcs.ref.head.name
        - vcs.ref.head.type
        - vcs.repository.name
        - vcs.repository.url.full
        - vcs.revision_delta.direction
        description: The number of revisions (commits) a ref (branch) is ahead/behind
          the branch from trunk (default).
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{revision}'
      vcs.ref.time:
        attributes:
        - vcs.ref.head.name
        - vcs.ref.head.type
        - vcs.repository.name
        - vcs.repository.url.full
        description: Time a ref (branch) created from the default branch (trunk) has
          existed. The `vcs.ref.type` attribute will always be `branch`.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: s
      vcs.repository.count:
        attributes: []
        description: The number of repositories in an organization.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{repository}'
    reaggregation_enabled: true
    resource_attributes:
      vcs.owner.name:
        description: The group owner within the version control system
        enabled: true
        type: string
      vcs.provider.name:
        description: The name of the version control system provider
        enabled: true
        type: string
    sem_conv_version: 1.40.0
    status:
      class: receiver
      codeowners:
        active:
        - adrielp
        - crobert-1
        - TylerHelmuth
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
        - traces
    type: github
