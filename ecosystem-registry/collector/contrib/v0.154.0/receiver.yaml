          description: Number of times a message couldn't be decoded by the configured
            encoder
          enabled: true
          extended_documentation: 'The receiver reads messages from Google Cloud Pub/Sub
            and tries to decode the message using the configured

            encoder. Each time a message fails to decoded the counter is increased.

            '
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        receiver.googlecloudpubsub.stream_restarts:
          description: Number of times the stream (re)starts due to a Pub/Sub servers
            connection close
          enabled: true
          extended_documentation: 'The receiver uses the Google Cloud Pub/Sub StreamingPull
            API and keeps a open connection. The Pub/Sub servers

            recurrently close the connection after a time period to avoid a long-running
            sticky connection. This metric

            counts the number of the resets that occurred during the lifetime of the
            container.

            '
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
    type: googlecloudpubsub
