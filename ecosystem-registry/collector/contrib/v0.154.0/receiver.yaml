      memory_type:
        description: The type of memory used.
        enum:
        - resident
        - virtual
        name_override: type
        requirement_level: recommended
        type: string
      operation:
        description: The MongoDB operation being counted.
        enum:
        - command
        - delete
        - getmore
        - insert
        - query
