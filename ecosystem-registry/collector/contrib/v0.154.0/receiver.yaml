- name: icmpcheckreceiver
  metadata:
    description: The ICMP Check Receiver can be used for synthetic checks against
      network endpoints. This receiver will send ICMP Echo Requests (pings) to the
      specified `targets`. It provides device availability monitoring and interface
      statistics with native OpenTelemetry OTLP metrics generation.
    display_name: ICMP Check Receiver
    metrics:
      ping.loss.ratio:
        description: The percentage of lost packets.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: '%'
      ping.rtt.avg:
        description: Average round-trip time in milliseconds.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: ms
      ping.rtt.max:
        description: Maximum round-trip time in milliseconds.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: ms
      ping.rtt.min:
        description: Minimum round-trip time in milliseconds.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: ms
      ping.rtt.stddev:
        description: Standard deviation of round-trip time in milliseconds.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: ms
    reaggregation_enabled: true
    resource_attributes:
      net.peer.ip:
        description: The IP address of the host being pinged.
        enabled: true
        type: string
      net.peer.name:
        description: The hostname of the host being pinged.
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - atoulme
        - jkoronaAtCisco
      distributions: []
      stability:
        development:
        - metrics
    type: icmpcheckreceiver
- name: iisreceiver
  metadata:
    attributes:
      direction:
        description: The direction data is moving.
        enum:
        - received
        - sent
        requirement_level: recommended
        type: string
      request:
        description: The type of request sent by a client.
        enum:
        - delete
        - get
        - head
        - options
        - post
        - put
        - trace
        requirement_level: recommended
        type: string
    description: The Microsoft IIS Receiver grabs metrics about an IIS instance using
      the Windows Performance Counters. Because of this, it is a Windows only receiver.
    display_name: Microsoft IIS Receiver
    metrics:
      iis.application_pool.state:
        description: The current status of the application pool (1 - Uninitialized,
          2 - Initialized, 3 - Running, 4 - Disabling, 5 - Disabled, 6 - Shutdown
          Pending, 7 - Delete Pending).
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{state}'
      iis.application_pool.uptime:
        description: The application pools uptime period since the last restart.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{ms}'
      iis.connection.active:
        description: Number of active connections.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{connections}'
      iis.connection.anonymous:
        description: Number of connections established anonymously.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{connections}'
      iis.connection.attempt.count:
        description: Total number of attempts to connect to the server.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{attempts}'
      iis.network.blocked:
        description: Number of bytes blocked due to bandwidth throttling.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      iis.network.file.count:
        attributes:
        - direction
        description: Number of transmitted files.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{files}'
      iis.network.io:
        attributes:
        - direction
        description: Total amount of bytes sent and received.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      iis.request.count:
        attributes:
        - request
        description: Total number of requests of a given type.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{requests}'
      iis.request.queue.age.max:
        description: Age of oldest request in the queue.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: ms
      iis.request.queue.count:
        description: Current number of requests in the queue.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{requests}'
      iis.request.rejected:
        description: Total number of requests rejected.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{requests}'
      iis.thread.active:
        description: Current number of active threads.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{threads}'
      iis.uptime:
        description: The amount of time the server has been up.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: s
    reaggregation_enabled: true
    resource_attributes:
      iis.application_pool:
        description: The application pool, which is associated with worker processes
          of one or more applications.
        enabled: true
        type: string
      iis.site:
        description: The site of the web server.
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - ishleenk17
        - Mrod1598
        - pjanotti
        seeking_new: true
      distributions:
      - contrib
      stability:
        beta:
        - metrics
      unsupported_platforms:
      - (windows && arm64)
      - darwin
      - linux
    type: iis
- name: influxdbreceiver
  metadata:
    description: This receiver accepts metrics data as [InfluxDB Line Protocol](https://docs.influxdata.com/influxdb/v2.0/reference/syntax/line-protocol/).
    display_name: InfluxDB Receiver
    status:
      class: receiver
      codeowners:
        active:
        - jacobmarble
      distributions:
      - contrib
      stability:
        beta:
        - metrics
    type: influxdb
- name: jaegerreceiver
  metadata:
    description: The Jaeger Receiver receives trace data in the [Jaeger](https://www.jaegertracing.io/)
      format.
    display_name: Jaeger Receiver
    status:
      class: receiver
      codeowners:
        active:
        - yurishkuro
      distributions:
      - contrib
      - core
      - k8s
      stability:
        beta:
        - traces
    type: jaeger
- name: jmxreceiver
  metadata:
    display_name: JMX Receiver
    status:
      class: receiver
      codeowners:
        active:
        - atoulme
        - rogercoll
        emeritus:
        - rmfitzpatrick
      deprecation:
        metrics:
          date: '2026-01-30'
          migration: use JMX Gatherer Java program
      distributions:
      - contrib
      stability:
        deprecated:
        - metrics
    type: jmx
- name: journaldreceiver
  metadata:
    description: The Journald Receiver parses Journald events from systemd journal.
    display_name: Journald Receiver
    status:
      class: receiver
      codeowners:
        active:
        - belimawr
        - namco1992
        emeritus:
        - djaglowski
        - sumo-drosiek
      distributions:
      - contrib
      - k8s
      stability:
        alpha:
        - logs
      unsupported_platforms:
      - darwin
      - windows
    type: journald
- name: k8sclusterreceiver
  metadata:
    attributes:
      condition:
        description: 'the name of Kubernetes Node condition. Example: Ready, Memory,
          PID, DiskPressure'
        requirement_level: required
        type: string
      k8s.container.status.reason:
        description: The reason of the current container status.
        enum:
        - Completed
        - ContainerCannotRun
        - ContainerCreating
        - CrashLoopBackOff
        - CreateContainerConfigError
        - ErrImagePull
        - Error
        - ImagePullBackOff
        - OOMKilled
        requirement_level: required
        type: string
      k8s.container.status.state:
        description: The state of the container (terminated, running, waiting). See
          https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.30/#containerstate-v1-core
          for details.
        enum:
        - running
        - terminated
        - waiting
        requirement_level: required
        type: string
      k8s.namespace.name:
        description: The k8s namespace name.
        requirement_level: recommended
        type: string
      k8s.persistentvolume.status.phase:
        description: The phase of the PersistentVolume.
        enum:
        - Available
        - Bound
        - Failed
        - Pending
        - Released
        requirement_level: required
        type: string
      k8s.persistentvolumeclaim.status.phase:
        description: The phase of the PersistentVolumeClaim.
        enum:
        - Bound
        - Lost
        - Pending
        requirement_level: required
        type: string
      k8s.service.endpoint.address_type:
        description: The address type of the endpoint.
        enum:
        - FQDN
        - IPv4
        - IPv6
        requirement_level: recommended
        type: string
      k8s.service.endpoint.condition:
        description: The condition of the service endpoint.
        enum:
        - ready
        - serving
        - terminating
        requirement_level: recommended
        type: string
      k8s.service.endpoint.zone:
        description: The zone of the service endpoint, typically corresponding to
          a failure domain.
        requirement_level: recommended
        type: string
      resource:
        description: the name of the resource on which the quota is applied
        requirement_level: required
        type: string
    description: The Kubernetes Cluster receiver collects cluster-level metrics and
      entity events from the Kubernetes API server. It uses the K8s API to listen
      for updates. A single instance of this receiver should be used to monitor a
      cluster.
    display_name: Kubernetes Cluster Receiver
    entities:
    - brief: A Kubernetes namespace
      description:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.namespace.uid
      stability: development
      type: k8s.namespace
    - brief: A Kubernetes node
      description:
      - ref: k8s.node.name
      - ref: k8s.kubelet.version
      - ref: container.runtime
      - ref: container.runtime.version
      - ref: os.description
      - ref: os.type
      identity:
      - ref: k8s.node.uid
      stability: development
      type: k8s.node
    - brief: A Kubernetes deployment
      description:
      - ref: k8s.deployment.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.deployment.uid
      stability: development
      type: k8s.deployment
    - brief: A Kubernetes replicaset
      description:
      - ref: k8s.replicaset.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.replicaset.uid
      stability: development
      type: k8s.replicaset
    - brief: A Kubernetes statefulset
      description:
      - ref: k8s.statefulset.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.statefulset.uid
      stability: development
      type: k8s.statefulset
    - brief: A Kubernetes daemonset
      description:
      - ref: k8s.daemonset.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.daemonset.uid
      stability: development
      type: k8s.daemonset
    - brief: A Kubernetes cronjob
      description:
      - ref: k8s.cronjob.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.cronjob.uid
      stability: development
      type: k8s.cronjob
    - brief: A Kubernetes job
      description:
      - ref: k8s.job.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.job.uid
      stability: development
      type: k8s.job
    - brief: A Kubernetes pod
      description:
      - ref: k8s.pod.name
      - ref: k8s.pod.qos_class
      extra_attributes:
      - ref: k8s.namespace.name
      - ref: k8s.node.name
      identity:
      - ref: k8s.pod.uid
      stability: development
      type: k8s.pod
    - brief: A Kubernetes container
      description:
      - ref: k8s.container.name
      - ref: container.image.name
      - ref: container.image.tag
      - ref: k8s.container.status.last_terminated_reason
      extra_attributes:
      - ref: k8s.pod.uid
      - ref: k8s.pod.name
      - ref: k8s.namespace.name
      - ref: k8s.node.name
      identity:
      - ref: container.id
      stability: development
      type: k8s.container
    - brief: A Kubernetes replication controller
      description:
      - ref: k8s.replicationcontroller.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.replicationcontroller.uid
      stability: development
      type: k8s.replicationcontroller
    - brief: A Kubernetes resource quota
      description:
      - ref: k8s.resourcequota.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.resourcequota.uid
      stability: development
      type: k8s.resourcequota
    - brief: A Kubernetes service
      description:
      - ref: k8s.service.name
      - ref: k8s.service.type
      - ref: k8s.service.publish_not_ready_addresses
      extra_attributes:
      - ref: k8s.namespace.name
      - ref: k8s.service.traffic_distribution
      identity:
      - ref: k8s.service.uid
      stability: development
      type: k8s.service
    - brief: A Kubernetes PersistentVolume object.
      description:
      - ref: k8s.persistentvolume.name
      - ref: k8s.storageclass.name
      - ref: k8s.persistentvolume.reclaim_policy
      identity:
      - ref: k8s.persistentvolume.uid
      stability: development
      type: k8s.persistentvolume
    - brief: A Kubernetes PersistentVolumeClaim object.
      description:
      - ref: k8s.persistentvolumeclaim.name
      extra_attributes:
      - ref: k8s.namespace.name
      - ref: k8s.storageclass.name
      identity:
      - ref: k8s.persistentvolumeclaim.uid
      stability: development
      type: k8s.persistentvolumeclaim
    - brief: A Kubernetes horizontal pod autoscaler
      description:
      - ref: k8s.hpa.name
      - ref: k8s.hpa.scaletargetref.apiversion
      - ref: k8s.hpa.scaletargetref.kind
      - ref: k8s.hpa.scaletargetref.name
      extra_attributes:
      - ref: k8s.namespace.name
      identity:
      - ref: k8s.hpa.uid
      stability: development
      type: k8s.hpa
    - brief: An OpenShift cluster resource quota
      description:
      - ref: openshift.clusterquota.name
      identity:
      - ref: openshift.clusterquota.uid
      stability: development
      type: openshift.clusterquota
    metrics:
      k8s.container.cpu_limit:
        description: Maximum resource limit set for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: double
        stability: development
        unit: '{cpu}'
      k8s.container.cpu_request:
        description: Resource requested for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: double
        stability: development
        unit: '{cpu}'
      k8s.container.ephemeralstorage_limit:
        description: Maximum resource limit set for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: By
      k8s.container.ephemeralstorage_request:
        description: Resource requested for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: By
      k8s.container.memory_limit:
        description: Maximum resource limit set for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: By
      k8s.container.memory_request:
        description: Resource requested for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: By
      k8s.container.ready:
        description: Whether a container has passed its readiness probe (0 for no,
          1 for yes)
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: ''
      k8s.container.restarts:
        description: How many times the container has restarted in the recent past.
          This value is pulled directly from the K8s API and the value can go indefinitely
          high and be reset to 0 at any time depending on how your kubelet is configured
          to prune dead containers. It is best to not depend too much on the exact
          value but rather look at it as either == 0, in which case you can conclude
          there were no restarts in the recent past, or > 0, in which case you can
          conclude there were restarts in the recent past, and not try and analyze
          the value beyond that.
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: '{restart}'
      k8s.container.status.reason:
        attributes:
        - k8s.container.status.reason
        description: Experimental metric, may experience breaking changes. Describes
          the number of K8s containers that are currently in a state for a given reason.
          All possible container state reasons will be reported at each time interval
          to avoid missing metrics. Only the value corresponding to the current state
          reason will be non-zero.
        enabled: false
        entity: k8s.container
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{container}'
      k8s.container.status.state:
        attributes:
        - k8s.container.status.state
        description: Experimental metric, may experience breaking changes. Describes
          the number of K8s containers that are currently in a given state. All possible
          container states will be reported at each time interval to avoid missing
          metrics. Only the value corresponding to the current state will be non-zero.
        enabled: false
        entity: k8s.container
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{container}'
      k8s.container.storage_limit:
        description: Maximum resource limit set for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: By
      k8s.container.storage_request:
        description: Resource requested for the container. See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.23/#resourcerequirements-v1-core
          for details
        enabled: true
        entity: k8s.container
        gauge:
          value_type: int
        stability: development
        unit: By
      k8s.cronjob.active_jobs:
        description: The number of actively running jobs for a cronjob
        enabled: true
        entity: k8s.cronjob
        gauge:
          value_type: int
        stability: development
        unit: '{job}'
      k8s.daemonset.current_scheduled_nodes:
        description: Number of nodes that are running at least 1 daemon pod and are
          supposed to run the daemon pod
        enabled: true
        entity: k8s.daemonset
        gauge:
          value_type: int
        stability: development
        unit: '{node}'
      k8s.daemonset.desired_scheduled_nodes:
        description: Number of nodes that should be running the daemon pod (including
          nodes currently running the daemon pod)
        enabled: true
        entity: k8s.daemonset
        gauge:
          value_type: int
        stability: development
        unit: '{node}'
      k8s.daemonset.misscheduled_nodes:
        description: Number of nodes that are running the daemon pod, but are not
          supposed to run the daemon pod
        enabled: true
        entity: k8s.daemonset
        gauge:
          value_type: int
        stability: development
        unit: '{node}'
      k8s.daemonset.ready_nodes:
        description: Number of nodes that should be running the daemon pod and have
          one or more of the daemon pod running and ready
        enabled: true
        entity: k8s.daemonset
        gauge:
          value_type: int
        stability: development
        unit: '{node}'
      k8s.deployment.available:
        description: Total number of available pods (ready for at least minReadySeconds)
          targeted by this deployment
        enabled: true
        entity: k8s.deployment
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.deployment.desired:
        description: Number of desired pods in this deployment
        enabled: true
        entity: k8s.deployment
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.hpa.current_replicas:
        description: Current number of pod replicas managed by this autoscaler.
        enabled: true
        entity: k8s.hpa
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.hpa.desired_replicas:
        description: Desired number of pod replicas managed by this autoscaler.
        enabled: true
        entity: k8s.hpa
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.hpa.max_replicas:
        description: Maximum number of replicas to which the autoscaler can scale
          up.
        enabled: true
        entity: k8s.hpa
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.hpa.min_replicas:
        description: Minimum number of replicas to which the autoscaler can scale
          up.
        enabled: true
        entity: k8s.hpa
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.job.active_pods:
        description: The number of actively running pods for a job
        enabled: true
        entity: k8s.job
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.job.desired_successful_pods:
        description: The desired number of successfully finished pods the job should
          be run with
        enabled: true
        entity: k8s.job
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.job.failed_pods:
        description: The number of pods which reached phase Failed for a job
        enabled: true
        entity: k8s.job
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.job.max_parallel_pods:
        description: The max desired number of pods the job should run at any given
          time
        enabled: true
        entity: k8s.job
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.job.successful_pods:
        description: The number of pods which reached phase Succeeded for a job
        enabled: true
        entity: k8s.job
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.namespace.phase:
        description: The current phase of namespaces (1 for active and 0 for terminating)
        enabled: true
        entity: k8s.namespace
        gauge:
          value_type: int
        stability: development
        unit: ''
      k8s.node.condition:
        attributes:
        - condition
        description: The condition of a particular Node.
        enabled: false
        entity: k8s.node
        gauge:
          value_type: int
        stability: development
        unit: '{condition}'
      k8s.persistentvolume.status.phase:
        attributes:
        - k8s.persistentvolume.status.phase
        description: The current phase of the PersistentVolume (1 for the current
          phase, 0 for others).
        enabled: false
        entity: k8s.persistentvolume
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{persistentvolume}'
      k8s.persistentvolume.storage.capacity:
        description: The storage capacity of the PersistentVolume.
        enabled: false
        entity: k8s.persistentvolume
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      k8s.persistentvolumeclaim.status.phase:
        attributes:
        - k8s.persistentvolumeclaim.status.phase
        description: The current phase of the PersistentVolumeClaim (1 for the current
          phase, 0 for others).
        enabled: false
        entity: k8s.persistentvolumeclaim
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{persistentvolumeclaim}'
      k8s.persistentvolumeclaim.storage.capacity:
        description: The actual storage capacity provisioned for the PersistentVolumeClaim.
          Only available when bound.
        enabled: false
        entity: k8s.persistentvolumeclaim
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      k8s.persistentvolumeclaim.storage.request:
        description: The storage requested by the PersistentVolumeClaim.
        enabled: false
        entity: k8s.persistentvolumeclaim
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      k8s.pod.phase:
        description: Current phase of the pod (1 - Pending, 2 - Running, 3 - Succeeded,
          4 - Failed, 5 - Unknown)
        enabled: true
        entity: k8s.pod
        gauge:
          value_type: int
        stability: development
        unit: ''
      k8s.pod.status_reason:
        description: Current status reason of the pod (1 - Evicted, 2 - NodeAffinity,
          3 - NodeLost, 4 - Shutdown, 5 - UnexpectedAdmissionError, 6 - Unknown)
        enabled: false
        entity: k8s.pod
        gauge:
          value_type: int
        stability: development
        unit: ''
      k8s.replicaset.available:
        description: Total number of available pods (ready for at least minReadySeconds)
          targeted by this replicaset
        enabled: true
        entity: k8s.replicaset
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.replicaset.desired:
        description: Number of desired pods in this replicaset
        enabled: true
        entity: k8s.replicaset
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.replication_controller.available:
        description: Total number of available pods (ready for at least minReadySeconds)
          targeted by this replication_controller
        enabled: true
        entity: k8s.replicationcontroller
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.replication_controller.desired:
        description: Number of desired pods in this replication_controller
        enabled: true
        entity: k8s.replicationcontroller
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.resource_quota.hard_limit:
        attributes:
        - resource
        description: The upper limit for a particular resource in a specific namespace.
          Will only be sent if a quota is specified. CPU requests/limits will be sent
          as millicores
        enabled: true
        entity: k8s.resourcequota
        gauge:
          value_type: int
        stability: development
        unit: '{resource}'
      k8s.resource_quota.used:
        attributes:
        - resource
        description: The usage for a particular resource in a specific namespace.
          Will only be sent if a quota is specified. CPU requests/limits will be sent
          as millicores
        enabled: true
        entity: k8s.resourcequota
        gauge:
          value_type: int
        stability: development
        unit: '{resource}'
      k8s.service.endpoint.count:
        attributes:
        - k8s.service.endpoint.address_type
        - k8s.service.endpoint.condition
        - k8s.service.endpoint.zone
        description: The number of endpoints for a service, broken down by condition,
          address type, and zone.
        enabled: false
        entity: k8s.service
        gauge:
          value_type: int
        stability: development
        unit: '{endpoint}'
      k8s.service.load_balancer.ingress.count:
        description: The number of load balancer ingress points (external IPs/hostnames)
          assigned to the service.
        enabled: false
        entity: k8s.service
        gauge:
          value_type: int
        stability: development
        unit: '{ingress}'
      k8s.statefulset.current_pods:
        description: The number of pods created by the StatefulSet controller from
          the StatefulSet version
        enabled: true
        entity: k8s.statefulset
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.statefulset.desired_pods:
        description: Number of desired pods in the stateful set (the `spec.replicas`
          field)
        enabled: true
        entity: k8s.statefulset
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.statefulset.ready_pods:
        description: Number of pods created by the stateful set that have the `Ready`
          condition
        enabled: true
        entity: k8s.statefulset
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      k8s.statefulset.updated_pods:
        description: Number of pods created by the StatefulSet controller from the
          StatefulSet version
        enabled: true
        entity: k8s.statefulset
        gauge:
          value_type: int
        stability: development
        unit: '{pod}'
      openshift.appliedclusterquota.limit:
        attributes:
        - k8s.namespace.name
        - resource
        description: The upper limit for a particular resource in a specific namespace.
        enabled: true
        entity: openshift.clusterquota
        gauge:
          value_type: int
        stability: development
        unit: '{resource}'
      openshift.appliedclusterquota.used:
        attributes:
        - k8s.namespace.name
        - resource
        description: The usage for a particular resource in a specific namespace.
        enabled: true
        entity: openshift.clusterquota
        gauge:
          value_type: int
        stability: development
        unit: '{resource}'
      openshift.clusterquota.limit:
        attributes:
        - resource
        description: The configured upper limit for a particular resource.
        enabled: true
        entity: openshift.clusterquota
        gauge:
          value_type: int
        stability: development
        unit: '{resource}'
      openshift.clusterquota.used:
        attributes:
        - resource
        description: The usage for a particular resource with a configured limit.
        enabled: true
        entity: openshift.clusterquota
