        requirement_level: recommended
        type: string
      wait.type:
        description: Type of the wait, view [WaitTypes documentation](https://learn.microsoft.com/en-us/sql/relational-databases/system-dynamic-management-views/sys-dm-os-wait-stats-transact-sql?view=sql-server-ver16#WaitTypes)
          for more information.
        requirement_level: recommended
        type: string
    description: The `sqlserver` receiver grabs metrics/logs about a Microsoft SQL
      Server instance. The receiver works by either using the Windows Performance
      Counters, or by directly connecting to the instance and querying it. Windows
      Performance Counters are only available when running on Windows.
