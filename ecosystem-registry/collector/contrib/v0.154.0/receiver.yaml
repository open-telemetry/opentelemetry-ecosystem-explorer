- name: vcrreceiver
  metadata:
    description: The OpenTelemetry **Verbatim Capture & Replay (VCR) toolset** enables
      full-fidelity capture and replay of all telemetry data stored on disk. It replays
      previously captured telemetry while **preserving original event timestamps**,
      allowing you to simulate realistic traffic timing independent of when the data
      was captured.
    display_name: VCR Receiver
    status:
      class: receiver
      codeowners:
        active:
        - atoulme
        - robertgustafsonsplunk
        - garrett-splunk
      stability:
        development:
        - logs
        - metrics
        - profiles
        - traces
    type: vcr
- name: wavefrontreceiver
  metadata:
