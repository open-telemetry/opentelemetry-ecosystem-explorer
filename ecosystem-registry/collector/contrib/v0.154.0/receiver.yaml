        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
    reaggregation_enabled: true
    resource_attributes:
      server.address:
        description: The address of the MongoDB host.
        enabled: true
        type: string
      server.port:
        description: The port of the MongoDB host.
        enabled: false
        type: int
      service.instance.id:
        description: A unique identifier of the MongoDB resource as a UUID v5, derived
          from server address and port.
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - justinianvoss22
        - dyl10s
        - ishleenk17
        seeking_new: true
      distributions:
