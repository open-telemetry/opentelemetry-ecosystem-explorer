        description: The database name.
        type: string
      db.query.text:
        description: The text of the database query being executed.
        type: string
      db.server.name:
        description: The name of the server hosting the database.
        type: string
      db.system.name:
        description: The database management system (DBMS) product as identified by
          the client instrumentation.
        type: string
      destination.type:
        description: Type of the SQL*Net destination endpoint (client application
          or remote database link).
        enum:
        - client
        - dblink
        type: string
      disk.io.block_size:
        description: Multi-block vs single-block (all) I/O request grouping.
        enum:
        - all
        - multi
        type: string
      disk.io.direction:
        description: Direction of the storage I/O operation.
        enum:
        - read
        - write
        type: string
      disk.io.type:
        description: Whether the I/O bytes are buffered (cache-mediated) or total
          (raw transfer count).
        enum:
        - buffered
        - total
        type: string
      network.io.direction:
        description: Direction of the SQL*Net network transfer.
        enum:
        - receive
        - transmit
        type: string
      network.peer.address:
        description: IP address of the peer client.
        type: string
      network.peer.port:
        description: TCP port used by the peer client.
        type: int
      oracledb.application_wait_time:
        description: The total time (in seconds) a query spent waiting on the application
          before it could proceed with execution (reporting delta).
        type: double
      oracledb.blocking.blocker.root_sid:
        description: The session ID (SID) of the root/head blocker at the top of the
          blocking chain. Empty string when there is no blocking.
        type: string
      oracledb.blocking.blocker.sid:
        description: The session ID (SID) of the immediate blocker of this session.
          Empty string when the session is not blocked.
        type: string
      oracledb.blocking.blocker.state:
        description: The status of the blocking session relationship (e.g. VALID,
          NOT IN WAIT, GLOBAL, NO HOLDER, UNKNOWN).
        type: string
      oracledb.blocking.lock.mode:
        description: The lock mode being requested by the blocked session (e.g., ROW
          SHARE, ROW EXCLUSIVE, SHARE, SHARE ROW EXCLUSIVE, EXCLUSIVE). Empty when
          not waiting on a lock.
        type: string
      oracledb.blocking.lock.type:
        description: The type of enqueue lock the session is waiting on, extracted
          from the wait event (e.g., TX for row lock, TM for table lock). Empty when
          not waiting on a lock.
        type: string
      oracledb.blocking.object.name:
        description: The name of the database object the session is waiting to lock.
          Empty when no object lock wait is active.
        type: string
      oracledb.blocking.object.owner:
        description: The owner (schema) of the database object the session is waiting
          to lock. Empty when no object lock wait is active.
        type: string
      oracledb.blocking.start_time:
        description: Estimated UTC timestamp of when the blocking wait began, derived
          from SYSDATE - SECONDS_IN_WAIT. RFC3339 format.
        type: string
      oracledb.blocking.wait_duration:
        description: The number of seconds this session has been waiting for the current
          wait event.
        type: int
      oracledb.buffer_gets:
        description: Number of logical reads (i.e., buffer cache accesses) performed
          by a query (reporting delta).
        type: int
      oracledb.child_address:
        description: Address of the child cursor.
        type: string
      oracledb.child_number:
        description: The child number of the query.
        type: string
      oracledb.cluster_wait_time:
        description: Total time (in seconds) that a query waited due to Oracle Real
          Application Clusters (RAC) coordination (reporting delta).
        type: double
      oracledb.command_type:
        description: Command type of the query.
        type: int
      oracledb.concurrency_wait_time:
        description: Total time (in seconds) a query spent waiting on concurrency-related
          events (reporting delta).
        type: double
      oracledb.cpu_time:
        description: Total time (in seconds) that the CPU spent actively processing
          a query, excluding time spent waiting (reporting delta).
        type: double
      oracledb.direct_reads:
        description: The number of direct path reads performed by a query — i.e.,
          data blocks read directly from disk into the session’s memory (reporting
          delta).
        type: int
      oracledb.direct_writes:
        description: The number of direct path write operations, where data is written
          directly to disk from user memory (reporting delta).
        type: int
      oracledb.disk_reads:
        description: The number of physical reads a query performs — that is, the
          number of data blocks read from disk (reporting delta).
        type: int
      oracledb.duration_sec:
        description: Total time taken by a database query to execute.
        type: double
      oracledb.elapsed_time:
        description: The total time (in seconds) taken by a query from start to finish,
          including CPU time and all types of waits (reporting delta).
        type: double
      oracledb.event:
        description: The specific wait event that a query or session is currently
          experiencing.
        type: string
      oracledb.executions:
        description: The number of times a specific SQL query has been executed (reporting
          delta).
        type: int
      oracledb.module:
        description: Logical module name of the client application that initiated
          a query or session.
        type: string
      oracledb.osuser:
        description: Name of the operating system user that initiated or is running
          the Oracle database session.
        type: string
      oracledb.parse.result:
        description: Result of a parse operation (e.g., failure).
        enum:
        - failure
        type: string
      oracledb.parse.type:
        description: Type of parse operation (e.g., soft).
        enum:
        - soft
        type: string
      oracledb.physical_read_bytes:
        description: The total number of bytes read from disk by a query (reporting
          delta).
        type: int
      oracledb.physical_read_requests:
        description: The number of physical I/O read operations performed by a query
          (reporting delta).
        type: int
      oracledb.physical_write_bytes:
        description: The total number of bytes written to disk by a query (reporting
          delta).
        type: int
      oracledb.physical_write_requests:
        description: The number of times a query requested to write data to disk (reporting
          delta).
        type: int
      oracledb.plan.last_load:
        description: 'Plan load time in the server''s local timezone. Format: YYYY-MM-DD/HH:MM:SS'
        type: string
      oracledb.plan_hash_value:
        description: Binary hash value calculated on the query execution plan and
          used to identify similar query execution plans, reported in the HEX format.
        type: string
      oracledb.procedure_execution_count:
        description: The number of times the stored procedure has been executed, derived
          from the minimum statement execution count across all statements in the
          procedure (reporting delta). Please note, this is best effort and may not
          be accurate in some scenarios. Use with caution.
        type: int
      oracledb.procedure_id:
        description: The identifier of the stored procedure or function being executed
          by the query.
        type: int
      oracledb.procedure_name:
        description: Name of the database object that a query is accessing.
        type: string
      oracledb.procedure_type:
        description: Type of the database object that a query is accessing.
        type: string
      oracledb.process:
        description: The operating system process ID (PID) associated with a session.
        type: string
      oracledb.program:
        description: Name of the client program or tool that initiated the Oracle
          database session.
        type: string
      oracledb.query.started:
        description: The timestamp when the SQL statement started execution, in ISO
          8601 format (UTC).
        type: string
      oracledb.query.wait_time:
        description: The wait time in seconds. If the session is currently waiting,
          the value is the time spent waiting in the current wait. Returns 0 if the
          session is not currently waiting.
        type: double
      oracledb.query_plan:
        description: The query execution plan used by the SQL Server.
        type: string
      oracledb.rows_processed:
        description: The total number of rows that a query has read, returned, or
          affected during its execution (reporting delta).
        type: int
      oracledb.schemaname:
        description: Oracle schema under which SQL statements are being executed
        type: string
      oracledb.serial:
        description: Serial number associated with a session.
        type: string
      oracledb.session.duration:
        description: The total time in seconds that the session has been connected.
        type: double
      oracledb.session.started:
        description: The timestamp when the session logged on, in ISO 8601 format
          (UTC).
        type: string
      oracledb.sid:
        description: ID of the Oracle Server session.
        type: string
      oracledb.sort.type:
        description: Type of sort operation (e.g., memory, disk).
        enum:
        - memory
        type: string
      oracledb.sql_id:
        description: The SQL ID of the query.
        type: string
      oracledb.state:
        description: Current state of the query or the session executing it.
        type: string
      oracledb.status:
        description: Execution state or result of a database query or session.
        type: string
      oracledb.user_io_wait_time:
        description: The total time (in seconds) a query spent waiting for user I/O
          operations—such as reading or writing data to disk or network file systems
          (reporting delta).
        type: double
      oracledb.wait.count:
        description: Total number of waits for the wait event across all sessions.
        type: int
      oracledb.wait.duration:
        description: Total time waited in seconds for the wait event.
        type: double
      oracledb.wait_class:
        description: The category of wait events a query or session is currently experiencing
          in Oracle Database.
        type: string
      session_status:
        description: Session status
        requirement_level: recommended
        type: string
      session_type:
        description: Session type
        requirement_level: recommended
        type: string
      tablespace_name:
        description: Tablespace name
        requirement_level: recommended
        type: string
      user.name:
        description: Database user name under which a session is connected to
        type: string
    description: This receiver periodically queries an Oracle Database host to collect
      metrics.
    display_name: Oracle DB Receiver
    events:
      db.server.query_sample:
        attributes:
        - client.address
        - client.port
        - db.namespace
        - db.query.text
        - db.system.name
        - network.peer.address
        - network.peer.port
        - oracledb.blocking.blocker.root_sid
        - oracledb.blocking.blocker.sid
        - oracledb.blocking.blocker.state
        - oracledb.blocking.lock.mode
        - oracledb.blocking.lock.type
        - oracledb.blocking.object.name
        - oracledb.blocking.object.owner
        - oracledb.blocking.start_time
        - oracledb.blocking.wait_duration
        - oracledb.child_address
        - oracledb.child_number
        - oracledb.duration_sec
        - oracledb.event
        - oracledb.module
        - oracledb.osuser
        - oracledb.plan_hash_value
        - oracledb.procedure_id
        - oracledb.procedure_name
        - oracledb.procedure_type
        - oracledb.process
        - oracledb.program
        - oracledb.query.started
        - oracledb.query.wait_time
        - oracledb.schemaname
        - oracledb.serial
        - oracledb.session.duration
        - oracledb.session.started
        - oracledb.sid
        - oracledb.sql_id
        - oracledb.state
        - oracledb.status
        - oracledb.wait_class
        - user.name
        description: sample query
        enabled: false
      db.server.session.wait_sample:
        attributes:
        - oracledb.event
        - oracledb.serial
        - oracledb.sid
        - oracledb.wait.count
        - oracledb.wait.duration
        - oracledb.wait_class
        description: Per-session wait event statistics from v$session_event.
        enabled: false
      db.server.top_query:
        attributes:
        - db.query.text
        - db.server.name
        - db.system.name
        - oracledb.application_wait_time
        - oracledb.buffer_gets
        - oracledb.child_address
        - oracledb.child_number
        - oracledb.cluster_wait_time
        - oracledb.command_type
        - oracledb.concurrency_wait_time
        - oracledb.cpu_time
        - oracledb.direct_reads
        - oracledb.direct_writes
        - oracledb.disk_reads
        - oracledb.elapsed_time
        - oracledb.executions
        - oracledb.physical_read_bytes
        - oracledb.physical_read_requests
        - oracledb.physical_write_bytes
        - oracledb.physical_write_requests
        - oracledb.plan.last_load
        - oracledb.plan_hash_value
        - oracledb.procedure_execution_count
        - oracledb.procedure_id
        - oracledb.procedure_name
        - oracledb.procedure_type
        - oracledb.query_plan
        - oracledb.rows_processed
        - oracledb.sql_id
        - oracledb.user_io_wait_time
        description: Collection of event metrics for top N queries, filtered based
          on the highest CPU time consumed (oracledb.elapsed_time).
        enabled: false
    metrics:
      oracledb.buffer_cache.utilization:
        description: Fraction of logical reads served from the buffer cache without
          physical I/O, as computed by Oracle V$SYSMETRIC (% (LogRead - PhyRead)/LogRead).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.consistent_gets:
        description: Number of times a consistent read was requested for a block from
          the buffer cache.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{gets}'
      oracledb.cpu_time:
        description: Cumulative CPU time, in seconds
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: double
        unit: s
      oracledb.data_dictionary.hit_ratio:
        description: Data dictionary cache hit ratio from v$rowcache.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.database.cpu.utilization:
        description: Fraction of total database time spent on CPU, as computed by
          Oracle V$SYSMETRIC (% Cpu/DB_Time).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.database.wait.utilization:
        description: Fraction of total database time spent waiting on I/O, locks,
          or latches, as computed by Oracle V$SYSMETRIC (% Wait/DB_Time).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.db_block_gets:
        description: Number of times a current block was requested from the buffer
          cache.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{gets}'
      oracledb.ddl_statements_parallelized:
        description: Number of DDL statements that were executed in parallel
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{statements}'
      oracledb.dml_locks.limit:
        description: Maximum limit of active DML (Data Manipulation Language) locks,
          -1 if unlimited.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{locks}'
      oracledb.dml_locks.usage:
        description: Current count of active DML (Data Manipulation Language) locks.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{locks}'
      oracledb.dml_statements_parallelized:
        description: Number of DML statements that were executed in parallel
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{statements}'
      oracledb.enqueue_deadlocks:
        description: Total number of deadlocks between table or row locks in different
          sessions.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{deadlocks}'
      oracledb.enqueue_locks.limit:
        description: Maximum limit of active enqueue locks, -1 if unlimited.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{locks}'
      oracledb.enqueue_locks.usage:
        description: Current count of active enqueue locks.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{locks}'
      oracledb.enqueue_resources.limit:
        description: Maximum limit of active enqueue resources, -1 if unlimited.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{resources}'
      oracledb.enqueue_resources.usage:
        description: Current count of active enqueue resources.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{resources}'
      oracledb.exchange_deadlocks:
        description: Number of times that a process detected a potential deadlock
          when exchanging two buffers and raised an internal, restartable error. Index
          scans are the only operations that perform exchanges.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{deadlocks}'
      oracledb.execution.utilization:
        attributes:
        - oracledb.parse.type
        description: Fraction of executions that did not require a parse, as computed
          by Oracle V$SYSMETRIC (% (ExecWOParse/TotalExec)). High values indicate
          good cursor reuse.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.executions:
        description: Total number of calls (user and recursive) that executed SQL
          statements
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.hard_parses:
        description: Number of hard parses
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{parses}'
      oracledb.host.cpu.utilization:
        description: Fraction of host CPU time in use, as computed by Oracle V$SYSMETRIC
          (% Busy/(Idle+Busy)).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.library_cache.utilization:
        description: Fraction of library cache pin requests that found the object
          already cached, as computed by Oracle V$SYSMETRIC (% Hits/Pins).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.logical_reads:
        description: Number of logical reads
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{reads}'
      oracledb.logons:
        description: Number of logon operations
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{operation}'
      oracledb.parallel_operations_downgraded_1_to_25_pct:
        description: Number of times parallel execution was requested and the degree
          of parallelism was reduced down to 1-25% because of insufficient parallel
          execution servers
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.parallel_operations_downgraded_25_to_50_pct:
        description: Number of times parallel execution was requested and the degree
          of parallelism was reduced down to 25-50% because of insufficient parallel
          execution servers
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.parallel_operations_downgraded_50_to_75_pct:
        description: Number of times parallel execution was requested and the degree
          of parallelism was reduced down to 50-75% because of insufficient parallel
          execution servers
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.parallel_operations_downgraded_75_to_99_pct:
        description: Number of times parallel execution was requested and the degree
          of parallelism was reduced down to 75-99% because of insufficient parallel
          execution servers
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.parallel_operations_downgraded_to_serial:
        description: Number of times parallel execution was requested but execution
          was serial because of insufficient parallel execution servers
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.parallel_operations_not_downgraded:
        description: Number of times parallel execution was executed at the requested
          degree of parallelism
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{executions}'
      oracledb.parse.rate:
        attributes:
        - oracledb.parse.result
        description: Rate of parse operations per second broken down by result, as
          computed by Oracle V$SYSMETRIC (e.g., Parse Failure Count Per Sec).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '{parses}/s'
      oracledb.parse.utilization:
        description: Fraction of parse calls that were soft parses, as computed by
          Oracle V$SYSMETRIC (% SoftParses/TotalParses). High values indicate good
          cursor reuse.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.parse_calls:
        description: Total number of parse calls.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{parses}'
      oracledb.pga_memory:
        description: Session PGA (Program Global Area) memory
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: By
      oracledb.physical_io.cache_writes:
        description: Number of physical writes from the buffer cache to disk by DBWR.
          Sourced from v$sysstat name physical writes from cache.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{writes}'
      oracledb.physical_io.requests:
        attributes:
        - disk.io.block_size
        - disk.io.direction
        description: Number of physical I/O requests issued to storage. Sourced from
          v$sysstat names physical read/write total IO requests (disk.io.block_size=all)
          and physical read/write total multi block requests (disk.io.block_size=multi).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{requests}'
      oracledb.physical_io.transferred:
        attributes:
        - disk.io.direction
        - disk.io.type
        description: Total physical I/O bytes transferred between Oracle and storage.
          Sums across all data files. Sourced from v$sysstat names physical read/write
          bytes (disk.io.type=buffered) and physical read/write total bytes (disk.io.type=total).
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: By
      oracledb.physical_read_io_requests:
        description: Number of read requests for application activity
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{requests}'
      oracledb.physical_reads:
        description: Number of physical reads
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{reads}'
      oracledb.physical_reads_direct:
        description: Number of reads directly from disk, bypassing the buffer cache
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{reads}'
      oracledb.physical_write_io_requests:
        description: Number of write requests for application activity
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{requests}'
      oracledb.physical_writes:
        description: Number of physical writes
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{writes}'
      oracledb.physical_writes_direct:
        description: Number of writes directly to disk, bypassing the buffer cache
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{writes}'
      oracledb.processes.limit:
        description: Maximum limit of active processes, -1 if unlimited.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{processes}'
      oracledb.processes.usage:
        description: Current count of active processes.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{processes}'
      oracledb.queries_parallelized:
        description: Number of SELECT statements executed in parallel
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{queries}'
      oracledb.recycle_bin.limit:
        description: Total size of the recycle bin.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: By
      oracledb.redo_allocation.utilization:
        description: Fraction of redo allocations that succeeded without space contention,
          as computed by Oracle V$SYSMETRIC (% (#Redo - RedoSpaceReq)/#Redo).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.sessions.limit:
        description: Maximum limit of active sessions, -1 if unlimited.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{sessions}'
      oracledb.sessions.usage:
        attributes:
        - session_status
        - session_type
        description: Count of active sessions.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{sessions}'
      oracledb.shared_pool.utilization:
        description: Fraction of the shared pool that is currently free, as computed
          by Oracle V$SYSMETRIC (% Free/Total). Low values indicate shared pool pressure.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '%'
      oracledb.sort.ratio:
        attributes:
        - oracledb.sort.type
        description: Fraction of sorts performed in memory vs disk, as computed by
          Oracle V$SYSMETRIC (% MemSort/(MemSort + DiskSort)). Low values indicate
          PGA memory pressure.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '1'
      oracledb.sql_service.response.duration:
        description: Average SQL service response time in seconds, converted from
          centiseconds as reported by Oracle V$SYSMETRIC (CentiSeconds Per Call).
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: s
      oracledb.sqlnet.io.transferred:
        attributes:
        - destination.type
        - network.io.direction
        description: Bytes transferred via SQL*Net between Oracle and clients/dblinks.
          Sourced from v$sysstat names bytes received/sent via SQL*Net from/to client/dblink.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: By
      oracledb.storage.usage:
        description: Used database storage size from dba_data_files and dba_free_space.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: By
      oracledb.storage.utilization:
        description: Fraction of allocated database storage that is used.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '1'
      oracledb.tablespace_size.limit:
        attributes:
        - tablespace_name
        description: Maximum size of tablespace in bytes, -1 if unlimited.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      oracledb.tablespace_size.usage:
        attributes:
        - tablespace_name
        description: Used tablespace in bytes.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      oracledb.transactions.limit:
        description: Maximum limit of active transactions, -1 if unlimited.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{transactions}'
      oracledb.transactions.usage:
        description: Current count of active transactions.
        enabled: true
        gauge:
          input_type: string
          value_type: int
        stability: development
        unit: '{transactions}'
      oracledb.user_commits:
        description: Number of user commits. When a user commits a transaction, the
          redo generated that reflects the changes made to database blocks must be
          written to disk. Commits often represent the closest thing to a user transaction
          rate.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '{commits}'
      oracledb.user_rollbacks:
        description: Number of times users manually issue the ROLLBACK statement or
          an error occurs during a user's transactions
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          input_type: string
          monotonic: true
          value_type: int
        unit: '1'
    reaggregation_enabled: true
    resource_attributes:
      host.name:
        description: The host name of Oracle Server
        enabled: true
        type: string
      oracle.db.hosting_type:
        description: The hosting environment of the Oracle instance. One of "self-managed",
          "rds", or "oci".
        enabled: true
        type: string
      oracle.db.open_mode:
        description: The open mode of the Oracle database (e.g. "READ WRITE", "READ
          ONLY", "MOUNTED").
        enabled: true
        type: string
      oracle.db.pdb:
        description: The pluggable database (PDB) name associated with the connection.
        enabled: true
        type: string
      oracle.db.role:
        description: The database role of the Oracle instance (e.g. "PRIMARY", "PHYSICAL
          STANDBY").
        enabled: true
        type: string
      oracle.db.version:
        description: The Oracle Database version string.
        enabled: true
        type: string
      oracledb.instance.name:
        description: The name of the instance that data is coming from.
        enabled: true
        type: string
      service.instance.id:
        description: A unique identifier of the Oracle DB instance in the format host:port/serviceName.
          (defaults to 'unknown:1521', in case of error in generating this value)
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - dmitryax
        - crobert-1
        - atoulme
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
        development:
        - logs
    type: oracledb
- name: osqueryreceiver
  metadata:
    description: The osquery Receiver runs queries run on an [osquery](https://osquery.io/)'s
      daemon on a schedule and converts the output to logs.
    display_name: osquery Receiver
    status:
      class: receiver
      codeowners:
        active:
        - smithclay
        emeritus:
        - nslaughter
      stability:
        alpha:
        - logs
    type: osquery
- name: otelarrowreceiver
  metadata:
    description: Receives telemetry data using [OpenTelemetry Protocol with Apache
      Arrow](https://github.com/open-telemetry/otel-arrow) and standard [OTLP]( https://github.com/open-telemetry/opentelemetry-specification/blob/main/specification/protocol/otlp.md)
      protocol via gRPC.
    display_name: Apache Arrow OTLP Receiver
    status:
      class: receiver
      codeowners:
        active:
        - jmacd
        - JakeDern
        emeritus:
        - moh-osman3
      distributions:
      - contrib
      - k8s
      stability:
        beta:
        - logs
        - metrics
        - traces
    type: otelarrow
- name: otlpjsonfilereceiver
  metadata:
    deprecated_type: otlpjsonfile
    description: This receiver will read pipeline data from JSON files. The data is
      written in [Protobuf JSON encoding](https://developers.google.com/protocol-buffers/docs/proto3#json)
      using [OpenTelemetry protocol](https://github.com/open-telemetry/opentelemetry-proto).
    display_name: OTLP JSON File Receiver
    status:
      class: receiver
      codeowners:
        active:
        - atoulme
        seeking_new: true
      distributions:
      - contrib
      stability:
        alpha:
        - logs
        - metrics
        - traces
        development:
        - profiles
    type: otlp_json_file
- name: podmanreceiver
  metadata:
    attributes:
      core:
        description: The CPU core number when utilising per-CPU metrics.
        requirement_level: recommended
        type: string
    description: The Podman Stats Receiver queries the Podman service API to fetch
      stats for all running containers on a configured interval. These stats are for
      container resource usage of cpu, memory, network, and the [blkio controller](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).
    display_name: Podman Stats Receiver
    metrics:
      container.blockio.io_service_bytes_recursive.read:
        description: Number of bytes transferred from the disk by the container
        enabled: true
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.blockio.io_service_bytes_recursive.write:
        description: Number of bytes transferred to the disk by the container
        enabled: true
        extended_documentation: '[More docs](https://www.kernel.org/doc/Documentation/cgroup-v1/blkio-controller.txt).'
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{operations}'
      container.cpu.percent:
        description: Percent of CPU used by the container.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: '1'
      container.cpu.usage.percpu:
        attributes:
        - core
        description: Total CPU time consumed per CPU-core.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: s
      container.cpu.usage.system:
        description: System CPU usage.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: s
      container.cpu.usage.total:
        description: Total CPU time consumed.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: s
      container.memory.percent:
        description: Percentage of memory used.
        enabled: true
        gauge:
          value_type: double
        stability: development
        unit: '1'
      container.memory.usage.limit:
        description: Memory limit of the container.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.memory.usage.total:
        description: Memory usage of the container.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      container.network.io.usage.rx_bytes:
        description: Bytes received by the container.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      container.network.io.usage.tx_bytes:
        description: Bytes sent by the container.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
    reaggregation_enabled: true
    resource_attributes:
      container.id:
        description: The ID of the container.
        enabled: true
        type: string
      container.image.name:
        description: The name of the image in use by the container.
        enabled: true
        type: string
      container.name:
        description: The name of the container.
        enabled: true
        type: string
      container.runtime:
        description: The runtime of the container. For this receiver, it will always
          be 'podman'.
        enabled: true
        type: string
    status:
      class: receiver
      codeowners:
        active:
        - rogercoll
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
      unsupported_platforms:
      - windows
    type: podman_stats
- name: postgresqlreceiver
  metadata:
    attributes:
      bg_buffer_source:
        description: The source of a buffer write.
        enum:
        - backend
        - backend_fsync
        - bgwriter
        - checkpoints
        name_override: source
        requirement_level: recommended
        type: string
      bg_checkpoint_type:
        description: The type of checkpoint state.
        enum:
        - requested
        - scheduled
        name_override: type
        requirement_level: recommended
        type: string
      bg_duration_type:
        description: The type of time spent during the checkpoint.
        enum:
        - sync
        - write
        name_override: type
        requirement_level: recommended
        type: string
      db.namespace:
        description: The namespace or schema of the database where the query is executed.
        type: string
      db.query.text:
        description: The text of the database query being executed.
        type: string
      db.system.name:
        description: The database management system (DBMS) product as identified by
          the client instrumentation.
        enum:
        - postgresql
        type: string
      function:
        description: The name of the function.
        requirement_level: recommended
        type: string
      lock_type:
        description: Type of the lockable object.
        requirement_level: recommended
        type: string
      mode:
        description: Name of the lock mode held or desired by the process.
        requirement_level: recommended
        type: string
      network.peer.address:
        description: IP address of the client connected to this backend.
        type: string
      network.peer.port:
        description: TCP port number that the client is using for communication with
          this backend.
        type: int
      operation:
        description: The database operation.
        enum:
        - del
        - hot_upd
        - ins
        - upd
        requirement_level: recommended
        type: string
      postgresql.application_name:
        description: Name of the application that is connected to this backend.
        type: string
      postgresql.calls:
        description: Number of times the statement was executed, reported in delta
          value.
        type: int
      postgresql.client_hostname:
        description: Host name of the connected client, as reported by a reverse DNS
          lookup of client_addr.
        type: string
      postgresql.pid:
        description: Process ID of this backend.
        type: int
      postgresql.query_id:
        description: Identifier of this backend's most recent query. If state is active
          this field shows the identifier of the currently executing query. In all
          other states, it shows the identifier of last query that was executed.
        type: string
      postgresql.query_plan:
        description: The execution plan used by PostgreSQL for the query.
        type: string
      postgresql.query_start:
        description: Time when the currently active query was started, or if state
          is not active, when the last query was started.
        type: string
      postgresql.queryid:
        description: Hash code to identify identical normalized queries.
        type: string
      postgresql.rolname:
        description: The name of the PostgreSQL role that executed the query.
        type: string
      postgresql.rows:
        description: Total number of rows retrieved or affected by the statement,
          reported in delta value.
        type: int
      postgresql.shared_blks_dirtied:
        description: Total number of shared blocks dirtied by the statement, reported
          in delta value.
        type: int
      postgresql.shared_blks_hit:
        description: Total number of shared block cache hits by the statement, reported
          in delta value.
        type: int
      postgresql.shared_blks_read:
        description: Total number of shared blocks read by the statement, reported
          in delta value.
        type: int
      postgresql.shared_blks_written:
        description: Total number of shared blocks written by the statement, reported
          in delta value.
        type: int
      postgresql.state:
        description: Current overall state of this backend
        type: string
      postgresql.temp_blks_read:
        description: Total number of temp blocks read by the statement, reported in
          delta value.
        type: int
      postgresql.temp_blks_written:
        description: Total number of temp blocks written by the statement, reported
          in delta value.
        type: int
      postgresql.total_exec_time:
        description: Total time spent executing the statement, in delta milliseconds.
        type: double
      postgresql.total_plan_time:
        description: Total time spent planning the statement, in delta milliseconds.
        type: double
      postgresql.wait_event:
        description: Wait event name if backend is currently waiting, otherwise NULL.
        type: string
      postgresql.wait_event_type:
        description: The type of event for which the backend is waiting, if any; otherwise
          NULL.
        type: string
      relation:
        description: OID of the relation targeted by the lock, or null if the target
          is not a relation or part of a relation.
        requirement_level: recommended
        type: string
      replication_client:
        description: The IP address of the client connected to this backend. If this
          field is "unix", it indicates either that the client is connected via a
          Unix socket.
        requirement_level: recommended
        type: string
      source:
        description: The block read source type.
        enum:
        - heap_hit
        - heap_read
        - idx_hit
        - idx_read
        - tidx_hit
        - tidx_read
        - toast_hit
        - toast_read
        requirement_level: recommended
        type: string
      state:
        description: The tuple (row) state.
        enum:
        - dead
        - live
        requirement_level: recommended
        type: string
      user.name:
        description: Name of the user logged into this backend.
        type: string
      wal_operation_lag:
        description: The operation which is responsible for the lag.
        enum:
        - flush
        - replay
        - write
        name_override: operation
        requirement_level: recommended
        type: string
    description: This receiver queries the PostgreSQL [statistics collector](https://www.postgresql.org/docs/13/monitoring-stats.html).
    display_name: PostgreSQL Receiver
    events:
      db.server.query_sample:
        attributes:
        - db.namespace
        - db.query.text
        - db.system.name
        - network.peer.address
        - network.peer.port
        - postgresql.application_name
        - postgresql.client_hostname
        - postgresql.pid
        - postgresql.query_id
        - postgresql.query_start
        - postgresql.state
        - postgresql.total_exec_time
        - postgresql.wait_event
        - postgresql.wait_event_type
        - user.name
        description: query sample
        enabled: false
      db.server.top_query:
        attributes:
        - db.namespace
        - db.query.text
        - db.system.name
        - postgresql.calls
        - postgresql.query_plan
        - postgresql.queryid
        - postgresql.rolname
        - postgresql.rows
        - postgresql.shared_blks_dirtied
        - postgresql.shared_blks_hit
        - postgresql.shared_blks_read
        - postgresql.shared_blks_written
        - postgresql.temp_blks_read
        - postgresql.temp_blks_written
        - postgresql.total_exec_time
        - postgresql.total_plan_time
        description: top query
        enabled: false
    feature_gates:
    - description: Metric `postgresql.wal.lag` is replaced by more precise `postgresql.wal.delay`.
      from_version: v0.89.0
      id: postgresqlreceiver.preciselagmetrics
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/30831
      skip_strict_validation: true
      stage: beta
    - description: Use of connection pooling
      from_version: v0.96.0
      id: receiver.postgresql.connectionPool
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/30831
      stage: beta
    - description: Moves Schema Names into dedicated Attribute
      from_version: v0.122.0
      id: receiver.postgresql.separateSchemaAttr
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/29559
      stage: alpha
    metrics:
      postgresql.backends:
        description: The number of backends.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '1'
      postgresql.bgwriter.buffers.allocated:
        description: Number of buffers allocated.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{buffers}'
      postgresql.bgwriter.buffers.writes:
        attributes:
        - bg_buffer_source
        description: Number of buffers written.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{buffers}'
      postgresql.bgwriter.checkpoint.count:
        attributes:
        - bg_checkpoint_type
        description: The number of checkpoints performed.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{checkpoints}'
      postgresql.bgwriter.duration:
        attributes:
        - bg_duration_type
        description: Total time spent writing and syncing files to disk by checkpoints.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: double
        unit: ms
      postgresql.bgwriter.maxwritten:
        description: Number of times the background writer stopped a cleaning scan
          because it had written too many buffers.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      postgresql.blks_hit:
        description: Number of times disk blocks were found already in the buffer
          cache.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{blks_hit}'
      postgresql.blks_read:
        description: Number of disk blocks read in this database.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{blks_read}'
      postgresql.blocks_read:
        attributes:
        - source
        description: The number of blocks read.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      postgresql.commits:
        description: The number of commits.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      postgresql.connection.max:
        description: Configured maximum number of client connections allowed
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{connections}'
      postgresql.database.count:
        description: Number of user databases.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{databases}'
      postgresql.database.locks:
        attributes:
        - lock_type
        - mode
        - relation
        description: The number of database locks.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{lock}'
      postgresql.db_size:
        description: The database disk usage.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      postgresql.deadlocks:
        description: The number of deadlocks.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{deadlock}'
      postgresql.function.calls:
        attributes:
        - function
        description: The number of calls made to a function. Requires `track_functions=pl|all`
          in Postgres config.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{call}'
      postgresql.index.scans:
        description: The number of index scans on a table.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{scans}'
      postgresql.index.size:
        description: The size of the index on disk.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      postgresql.operations:
        attributes:
        - operation
        description: The number of db row operations.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      postgresql.replication.data_delay:
        attributes:
        - replication_client
        description: The amount of data delayed in replication.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: By
      postgresql.rollbacks:
        description: The number of rollbacks.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '1'
      postgresql.rows:
        attributes:
        - state
        description: The number of rows in the database.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '1'
      postgresql.sequential_scans:
        description: The number of sequential scans.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{sequential_scan}'
      postgresql.table.count:
        description: Number of user tables in a database.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: '{table}'
      postgresql.table.size:
        description: Disk space used by a table.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: false
          value_type: int
        unit: By
      postgresql.table.vacuum.count:
        description: Number of times a table has manually been vacuumed.
        enabled: true
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: '{vacuum}'
      postgresql.temp.io:
        description: Total amount of data written to temporary files by queries.
        enabled: false
        stability: development
        sum:
          aggregation_temporality: cumulative
          monotonic: true
          value_type: int
        unit: By
      postgresql.temp_files:
        description: The number of temp files.
