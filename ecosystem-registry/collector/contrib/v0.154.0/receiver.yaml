- name: solacereceiver
  metadata:
    description: The Solace Receiver receives trace data from a [Solace PubSub+ Event
      Broker](https://solace.com/products/event-broker/).
    display_name: Solace Receiver
    status:
      class: receiver
      codeowners:
        active:
        - mcardy
      distributions:
      - contrib
      stability:
        beta:
        - traces
    telemetry:
      metrics:
        solacereceiver_dropped_egress_spans:
          description: Number of dropped egress spans
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_dropped_span_messages:
          description: Number of dropped span messages
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_failed_reconnections:
          description: Number of failed broker reconnections
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_fatal_unmarshalling_errors:
          description: Number of fatal message unmarshalling errors
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_need_upgrade:
          description: Indicates with value 1 that receiver requires an upgrade and
            is not compatible with messages received from a broker
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        solacereceiver_received_span_messages:
          description: Number of received span messages
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_receiver_flow_control_recent_retries:
          description: Most recent/current retry count when flow controlled
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        solacereceiver_receiver_flow_control_status:
          description: Indicates the flow control status of the receiver. 0 = not
            flow controlled, 1 = currently flow controlled
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        solacereceiver_receiver_flow_control_total:
          description: Number of times the receiver instance became flow controlled
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_receiver_flow_control_with_single_successful_retry:
          description: Number of times the receiver instance became flow controlled
            and resolved situations after the first retry
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_receiver_status:
          description: Indicates the status of the receiver as an enum. 0 = starting,
            1 = connecting, 2 = connected, 3 = disabled (often paired with needs_upgrade),
            4 = terminating, 5 = terminated
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        solacereceiver_recoverable_unmarshalling_errors:
          description: Number of recoverable message unmarshalling errors
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        solacereceiver_reported_spans:
          description: Number of reported spans
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
    type: solace
- name: splunkenterprisereceiver
  metadata:
    attributes:
      splunk.bucket.dir:
        description: The bucket super-directory (home, cold, thawed) for each index
        requirement_level: recommended
        type: string
      splunk.feature:
        description: The Feature name from the Splunk Health Introspection Endpoint
        requirement_level: recommended
        type: string
      splunk.feature.health:
        description: The Health (in color form) of a Splunk Feature from the Splunk
          Health Introspection Endpoint
        requirement_level: recommended
        type: string
      splunk.host:
        description: The name of the splunk host
        requirement_level: recommended
        type: string
      splunk.index.name:
        description: The name of the index reporting a specific KPI
        requirement_level: recommended
        type: string
      splunk.indexer.searchable:
        description: The searchability status reported for a specific object
        requirement_level: recommended
        type: string
      splunk.indexer.status:
        description: The status message reported for a specific object
        requirement_level: recommended
        type: string
      splunk.kvstore.external:
        description: Value denoting if the KV store is using an external service
        requirement_level: recommended
        type: string
      splunk.kvstore.status.value:
        description: The string value of the status returned when reporting on KV
          store using the introspection endpoint
        requirement_level: recommended
        type: string
      splunk.kvstore.storage.engine:
        description: The backend storage used by the KV store
        requirement_level: recommended
        type: string
      splunk.license.label:
        description: The label of the license.
        requirement_level: recommended
        type: string
      splunk.license.status:
        description: The status of the license.
        requirement_level: recommended
        type: string
      splunk.license.type:
        description: The type of license.
        requirement_level: recommended
        type: string
      splunk.queue.name:
        description: The name of the queue reporting a specific KPI
        requirement_level: recommended
        type: string
      splunk.rollingorrestart:
        description: Boolean that indicates if there is a rolling restart or rolling
          upgrade in progress.
        requirement_level: recommended
        type: bool
      splunk.search.state:
        description: The dispatch state of the search
        requirement_level: recommended
        type: string
      splunk.searchable.restart:
        description: Boolean that indicates if a searchable rolling restart/upgrade
          in progress.t
        requirement_level: recommended
        type: bool
      splunk.searchartifacts.cache.type:
        description: The search artifacts cache type
        requirement_level: recommended
        type: string
      splunk.splunkd.build:
        description: The build number for this Splunk instance version
        requirement_level: recommended
        type: string
      splunk.splunkd.version:
        description: The splunkd version number
        requirement_level: recommended
        type: string
    description: The Splunk Enterprise Receiver is a pull based tool which enables
      the ingestion of performance metrics describing the operational status of a
      user's Splunk Enterprise deployment to an appropriate observability tool. It
      is designed to leverage several different data sources to gather these metrics
      including the [introspection api endpoint](https://help.splunk.com/en/splunk-enterprise/leverage-rest-apis/rest-api-reference/9.1/introspection-endpoints/introspection-endpoint-descriptions)
      and serializing results from ad-hoc searches. Because of this, care must be
      taken by users when enabling metrics as running searches can effect your Splunk
      Enterprise Deployment and introspection may fail to report for Splunk Cloud
      deployments. The primary purpose of this receiver is to empower those tasked
      with the maintenance and care of a Splunk Enterprise deployment to leverage
      opentelemetry and their observability toolset in their jobs.
    display_name: Splunk Enterprise Receiver
    metrics:
      splunk.aggregation.queue.ratio:
        attributes:
        - splunk.host
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the average indexer aggregation queue ration (%).
          *Note:** Search is best run against a Cluster Manager.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '{%}'
      splunk.buckets.searchable.status:
        attributes:
        - splunk.host
        - splunk.indexer.searchable
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the number of buckets and their searchable status.
          *Note:** Search is best run against a Cluster Manager.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{count}'
      splunk.data.indexes.extended.bucket.count:
        attributes:
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Count of buckets per index
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{buckets}'
      splunk.data.indexes.extended.bucket.event.count:
        attributes:
        - splunk.bucket.dir
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Count of events in this bucket super-directory. *Note:** Must
          be pointed at specific indexer `endpoint`.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{events}'
      splunk.data.indexes.extended.bucket.hot.count:
        attributes:
        - splunk.bucket.dir
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: (If size > 0) Number of hot buckets. *Note:** Must be pointed
          at specific indexer `endpoint`.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{buckets}'
      splunk.data.indexes.extended.bucket.warm.count:
        attributes:
        - splunk.bucket.dir
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: (If size > 0) Number of warm buckets. *Note:** Must be pointed
          at specific indexer `endpoint` and gathers metrics from only that indexer.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{buckets}'
      splunk.data.indexes.extended.event.count:
        attributes:
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Count of events for index, excluding frozen events. Approximately
          equal to the event_count sum of all buckets. *Note:** Must be pointed at
          specific indexer `endpoint` and gathers metrics from only that indexer.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{events}'
      splunk.data.indexes.extended.raw.size:
        attributes:
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Size in bytes on disk of the <bucket>/rawdata/ directories of
          all buckets in this index, excluding frozen *Note:** Must be pointed at
          specific indexer `endpoint` and gathers metrics from only that indexer.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: By
      splunk.data.indexes.extended.total.size:
        attributes:
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Size in bytes on disk of this index *Note:** Must be pointed
          at specific indexer `endpoint` and gathers metrics from only that indexer.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: By
      splunk.health:
        attributes:
        - splunk.feature
        - splunk.feature.health
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: The status ('red', 'yellow', or 'green') of the Splunk server.
          Health of 'red' produces a 0 while all other colors produce a 1.
        enabled: true
        gauge:
          value_type: int
        stability: development
        unit: '{status}'
      splunk.indexer.avg.rate:
        attributes:
        - splunk.host
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the average rate of indexed data. **Note:** Search
          is best run against a Cluster Manager.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: KBy
      splunk.indexer.cpu.time:
        attributes:
        - splunk.host
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the number of indexing process cpu seconds per
          instance
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '{s}'
      splunk.indexer.queue.ratio:
        attributes:
        - splunk.host
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the average indexer index queue ration (%). *Note:**
          Search is best run against a Cluster Manager.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '{%}'
      splunk.indexer.raw.write.time:
        attributes:
        - splunk.host
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the number of raw write seconds per instance
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: '{s}'
      splunk.indexer.rollingrestart.status:
        attributes:
        - splunk.rollingorrestart
        - splunk.searchable.restart
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: The status of a rolling restart.
        enabled: false
        gauge:
          value_type: int
        stability: development
        unit: '{status}'
      splunk.indexer.throughput:
        attributes:
        - splunk.indexer.status
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking average bytes per second throughput of indexer.
          *Note:** Must be pointed at specific indexer `endpoint` and gathers metrics
          from only that indexer.
        enabled: false
        gauge:
          value_type: double
        stability: development
        unit: By/s
      splunk.indexes.avg.size:
        attributes:
        - splunk.index.name
        - splunk.splunkd.build
        - splunk.splunkd.version
        description: Gauge tracking the indexes and their average size (gb). *Note:**
          Search is best run against a Cluster Manager.
        enabled: false
        gauge:
          value_type: double
