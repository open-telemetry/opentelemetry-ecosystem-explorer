- name: splunkhecreceiver
  metadata:
    description: The Splunk HEC receiver accepts events in the [Splunk HEC format](https://help.splunk.com/en/splunk-enterprise/get-data-in/get-started-with-getting-data-in/10.0/get-data-with-http-event-collector/format-events-for-http-event-collector).
      This allows the collector to receive logs and metrics. The collector accepts
      data formatted as JSON [HEC events](https://help.splunk.com/en/splunk-enterprise/get-data-in/get-started-with-getting-data-in/10.0/get-data-with-http-event-collector/format-events-for-http-event-collector#ariaid-title5)
      under any path or as EOL separated log [raw data](https://help.splunk.com/en/splunk-enterprise/get-data-in/get-started-with-getting-data-in/10.0/get-data-with-http-event-collector/format-events-for-http-event-collector#raw-event-parsing-0)
      if sent to the `raw_path` path.
    display_name: Splunk HEC Receiver
    status:
      class: receiver
      codeowners:
        active:
        - atoulme
        emeritus: null
      distributions:
      - contrib
      stability:
        beta:
        - logs
        - metrics
    type: splunk_hec
- name: sqlqueryreceiver
  metadata:
    description: The SQL Query Receiver uses custom SQL queries to generate logs and/or
      metrics from a database connection.
    display_name: SQL Query Receiver
    status:
      class: receiver
      codeowners:
        active:
        - dmitryax
        - crobert-1
        emeritus:
        - pmcollins
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
        development:
        - logs
    type: sqlquery
- name: sqlserverreceiver
  metadata:
    attributes:
      cache.state:
        description: The state of the cache objects.
        enum:
        - in_use
        - total
        requirement_level: recommended
        type: string
      client.address:
        description: Hostname or address of the client.
        requirement_level: recommended
        type: string
      client.port:
        description: TCP port used by the client.
        requirement_level: recommended
        type: int
      database.status:
        description: The current status of a database
        enum:
        - offline
        - online
        - pending_recovery
        - recovering
        - restoring
        - suspect
        requirement_level: recommended
        type: string
      db.namespace:
        description: The database name.
        requirement_level: recommended
        type: string
      db.query.text:
        description: The text of the database query being executed.
        requirement_level: recommended
        type: string
      db.system.name:
        description: The database management system (DBMS) product as identified by
          the client instrumentation.
        requirement_level: recommended
        type: string
      direction:
        description: The direction of flow of bytes or operations.
        enum:
        - read
        - write
        requirement_level: recommended
        type: string
      file_type:
        description: The type of file being monitored.
        requirement_level: recommended
        type: string
      logical_filename:
        description: The logical filename of the file being monitored.
        requirement_level: recommended
        type: string
      memory.pool:
        description: The functional area of SQL Server memory.
        enum:
        - connection
        - granted_workspace
        - max_workspace
        - optimizer
        - sql_cache
        - target
        - total
        requirement_level: recommended
        type: string
      network.peer.address:
        description: IP address of the peer client.
        requirement_level: recommended
        type: string
      network.peer.port:
        description: TCP port used by the peer client.
        requirement_level: recommended
        type: int
      page.operations:
        description: The page operation types.
        enum:
        - read
        - write
        name_override: type
        requirement_level: recommended
        type: string
      page.pool:
        description: The type of page pool in the SQL Server buffer manager.
        enum:
        - cache
        - database
        - free
        - reserved
        - stolen
        - target
        - total
        requirement_level: recommended
        type: string
      performance_counter.object_name:
        description: Category to which this counter belongs
        requirement_level: recommended
        type: string
      physical_filename:
        description: The physical filename of the file being monitored.
        requirement_level: recommended
        type: string
      replica.direction:
        description: The direction of flow of bytes for replica.
        enum:
        - receive
        - transmit
        requirement_level: recommended
        type: string
      server.address:
        description: The network address of the server hosting the database.
        requirement_level: recommended
        type: string
      server.port:
        description: The port number on which the server is listening.
        requirement_level: recommended
        type: int
      sqlserver.blocking.start_time:
        description: Timestamp of when the current blocking wait began (ISO 8601 format).
        requirement_level: recommended
        type: string
      sqlserver.blocking_session_id:
        description: Session ID that is blocking the current session. 0 if none.
        requirement_level: recommended
        type: int
      sqlserver.client.app.name:
        description: Name of the client application that initiated the session.
        requirement_level: recommended
        type: string
      sqlserver.command:
        description: SQL command type being executed.
        requirement_level: recommended
        type: string
      sqlserver.context_info:
        description: Context information for the session, represented as a hexadecimal
          string.
        requirement_level: recommended
        type: string
      sqlserver.cpu_time:
        description: CPU time consumed by the query, in seconds.
        requirement_level: recommended
        type: double
      sqlserver.deadlock_priority:
        description: Deadlock priority value for the session.
        requirement_level: recommended
        type: int
      sqlserver.estimated_completion_time:
        description: Estimated time remaining for the request to complete, in seconds.
        requirement_level: recommended
        type: double
      sqlserver.execution_count:
        description: Number of times that the plan has been executed since it was
          last compiled, reported in delta value.
        requirement_level: recommended
        type: int
      sqlserver.lock_timeout:
        description: Lock timeout value in seconds.
        requirement_level: recommended
        type: double
      sqlserver.logical_reads:
        description: Number of logical reads (data read from cache/memory).
        requirement_level: recommended
        type: int
      sqlserver.open_transaction_count:
        description: Number of transactions currently open in the session.
        requirement_level: recommended
        type: int
      sqlserver.parameterization.result:
        description: The result of an auto-parameterization attempt by the SQL Server
          query optimizer.
        enum:
        - auto_attempted
        - failed
        - forced
        - safe
        - unsafe
        requirement_level: recommended
        type: string
      sqlserver.percent_complete:
        description: Percentage of work completed.
        requirement_level: recommended
        type: double
      sqlserver.plan.guidance.result:
        description: Whether a SQL plan execution successfully used a matching plan
