distribution: contrib
version: 0.158.1-SNAPSHOT
repository: opentelemetry-collector-contrib
component_type: processor
schema_hash: a0135ca939d9
components:
- name: attributesprocessor
  metadata:
    display_name: Attributes Processor
    status:
      class: processor
      codeowners:
        active:
        - boostchicken
      distributions:
      - contrib
      - core
      - k8s
      stability:
        beta:
        - logs
        - metrics
        - traces
      warnings:
      - Identity Conflict
    type: attributes
- name: awsecsattributesprocessor
  metadata:
    description: The `aws_ecs_attributes` processor enriches logs, metrics, traces
      and profiles with AWS ECS metadata for daemonset-style deployments on EC2, where
      a single collector runs per host and processes telemetry for all containers
      on that host.
    display_name: AWS ECS Attributes Processor
    status:
      class: processor
      codeowners:
        active:
        - povilasv
        - iblancasa
        - dmitryax
      distributions: []
      stability:
        development:
        - logs
        - metrics
        - profiles
        - traces
    type: aws_ecs_attributes
- name: cardinalityguardianprocessor
  metadata:
    description: An OpenTelemetry Collector processor that catches metric cardinality
      explosions before they reach your TSDB.
    display_name: Cardinality Guardian Processor
    status:
      class: processor
      codeowners:
        active:
        - atoulme
        - YElayyat
        - jmacd
      distributions:
      - contrib
      stability:
        alpha:
        - metrics
    telemetry:
      metrics:
        processor_cardinality_labels.stripped:
          description: Total number of high-cardinality labels stripped or tagged.
          enabled: true
          stability: development
          sum:
            async: true
            monotonic: true
            value_type: int
          unit: '{labels}'
        processor_cardinality_savings.estimated:
          description: Cumulative estimated dollar value of time-series churn prevented
            by the processor.
          enabled: true
          stability: development
          sum:
            async: true
            monotonic: true
            value_type: double
          unit: '{dollars}'
        processor_cardinality_top.offenders:
          description: Cardinality delta of the top-N highest-growth (metric, label)
            pairs from the last epoch rotation.
          enabled: true
          gauge:
            async: true
            value_type: int
          stability: development
          unit: '{pairs}'
        processor_cardinality_trackers.active:
          description: Current number of active cardinality trackers across all shards.
          enabled: true
          gauge:
            async: true
            value_type: int
          stability: development
          unit: '{trackers}'
        processor_cardinality_trackers.rejected:
          description: Number of new (metric, label) pairs ignored because max_tracker_count
            was reached.
          enabled: true
          stability: development
          sum:
            async: true
            monotonic: true
            value_type: int
          unit: '{trackers}'
    type: cardinality_guardian
- name: coralogixprocessor
  metadata:
    description: The Coralogix processor adds attributes to spans that enable features
      in Coralogix.
    display_name: Coralogix Processor
    status:
      class: processor
      codeowners:
        active:
        - crobert-1
        - povilasv
        - iblancasa
      distributions: []
      stability:
        alpha:
        - traces
      warnings:
      - Statefulness
    type: coralogix
- name: cumulativetodeltaprocessor
  metadata:
    attributes:
      metric_type:
        description: The pdata metric type of the datapoint.
        enum:
        - exponential_histogram
        - histogram
        - sum
        type: string
      reason:
        description: The reason a datapoint was dropped instead of converted.
        enum:
        - bucket_mismatch
        - initial
        - reset
        type: string
    deprecated_type: cumulativetodelta
    description: The cumulative to delta processor (`cumulativetodeltaprocessor`)
      converts monotonic sum, histogram, and exponential histogram metrics from cumulative
      to delta aggregation temporality. Non-monotonic sums are excluded. Delta metrics
      are excluded from any conversion and forwarded without changes.
    display_name: Cumulative to Delta Processor
    status:
      class: processor
      codeowners:
        active:
        - TylerHelmuth
      distributions:
      - contrib
      - k8s
      stability:
        beta:
        - metrics
      warnings:
      - Statefulness
    telemetry:
      metrics:
        cumulativetodelta_datapoints:
          attributes:
          - metric_type
          description: Number of datapoints converted from cumulative to delta temporality.
          enabled: false
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{datapoint}'
        cumulativetodelta_datapoints_dropped:
          attributes:
          - metric_type
          - reason
          description: Number of datapoints dropped instead of being converted.
          enabled: false
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{datapoint}'
        cumulativetodelta_streams_tracked:
          description: Number of metric streams currently tracked in memory for cumulative-to-delta
            conversion.
          enabled: false
          stability: development
          sum:
            async: true
            monotonic: false
            value_type: int
          unit: '{stream}'
    type: cumulative_to_delta
- name: deltatocumulativeprocessor
  metadata:
    deprecated_type: deltatocumulative
    description: The Delta to Cumulative Processor (`deltatocumulativeprocessor`)
      converts metrics from delta temporality to cumulative, by accumulating samples
      in memory.
    display_name: Delta to Cumulative Processor
    status:
      class: processor
      codeowners:
        active:
        - RichieSams
        emeritus:
        - tombrk
      distributions:
      - contrib
      - k8s
      stability:
        alpha:
        - metrics
      warnings:
      - Statefulness
    telemetry:
      metrics:
        deltatocumulative_datapoints:
          description: total number of datapoints processed. may have 'error' attribute,
            if processing failed
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{datapoint}'
        deltatocumulative_streams_limit:
          description: upper limit of tracked streams
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '{stream}'
        deltatocumulative_streams_max_stale:
          description: duration after which streams inactive streams are dropped
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: s
        deltatocumulative_streams_tracked:
          description: number of streams tracked
          enabled: true
          stability: development
          sum:
            async: true
            monotonic: false
            value_type: int
          unit: '{dps}'
    type: delta_to_cumulative
- name: deltatorateprocessor
  metadata:
    deprecated_type: deltatorate
    description: The Delta to Rate Processor (`deltatorateprocessor`) converts delta
      sum metrics to rate metrics. This rate is a gauge.
    display_name: Delta to Rate Processor
    status:
      class: processor
      codeowners:
        active:
        - Aneurysm9
      distributions:
      - contrib
      - k8s
      stability:
        alpha:
        - metrics
    type: delta_to_rate
- name: drainprocessor
  metadata:
    attributes:
      mask:
        description: The mask name that matched more than one position in a single
          template.
        type: string
    description: The Drain Processor applies the Drain log clustering algorithm to
      log records as they pass through the pipeline, deriving a template string (e.g.
      "user <*> logged in from <*>") and attaching it as an attribute on each record.
    display_name: Drain Processor
    status:
      class: processor
      codeowners:
        active:
        - MikeGoldsmith
        - atoulme
        - martinjt
      distributions:
      - contrib
      - k8s
      stability:
        alpha:
        - logs
    telemetry:
      metrics:
        processor_drain_clusters_active:
          description: Current number of active clusters in the Drain parse tree.
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '{clusters}'
        processor_drain_log_records_annotated:
          description: Number of log records successfully annotated with a template.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{records}'
        processor_drain_masks_duplicates:
          attributes:
          - mask
          description: Number of records where a mask name matched more than one position
            in the matched template. Incremented once per record per duplicated mask
            name; the losing values are discarded and first-match wins.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{records}'
    type: drain
- name: dynamicsamplingprocessor
  metadata:
    description: The Dynamic Sampling Processor performs adaptive trace sampling using
      first-match rules-based routing to dynamic samplers. Each sampler produces a
      known sample rate which is encoded as `ot=th` in W3C TraceState for correct
      downstream metric weighting.
    display_name: Dynamic Sampling Processor
    status:
      class: processor
      codeowners:
        active:
        - MikeGoldsmith
        - VinozzZ
        - jmacd
      distributions: []
      stability:
        development:
        - traces
    telemetry:
      metrics:
        processor_dynamic_sampling_decision_sample_rate:
          description: Distribution of effective sample rates produced per rule. Useful
            for detecting adaptive samplers settling at unexpected rates.
          enabled: true
          histogram:
            value_type: int
          stability: development
          unit: '{rate}'
        processor_dynamic_sampling_decision_triggers:
          description: Number of trace decisions made, labelled by which event triggered
            the decision (root_span, trace_timeout, eviction).
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{decisions}'
        processor_dynamic_sampling_incoming_tracestate_unparseable:
          description: Number of spans whose incoming W3C tracestate could not be
            parsed when applying the sampling threshold.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{spans}'
        processor_dynamic_sampling_ottl_eval_errors:
          description: Number of OTTL condition evaluation errors, labelled by the
            rule the condition belongs to.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{errors}'
        processor_dynamic_sampling_traces_active:
          description: Number of traces currently in the accumulation buffer awaiting
            a decision.
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '{traces}'
        processor_dynamic_sampling_traces_dropped:
          description: Number of traces that were dropped, labelled by the rule that
            selected them.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{traces}'
        processor_dynamic_sampling_traces_evicted:
          description: Number of traces evicted from the buffer due to num_traces
            pressure. Evicted traces are decided immediately per the configured eviction
            policy.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{traces}'
        processor_dynamic_sampling_traces_sampled:
          description: Number of traces that were sampled, labelled by the rule that
            selected them.
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{traces}'
    type: dynamic_sampling
- name: filterprocessor
  metadata:
    description: The Filter Processor allows dropping spans, span events, metrics,
      datapoints, and logs from the collector.
    display_name: Filter Processor
    feature_gates:
    - description: Changes the default error_mode of the filter processor from propagate
        to ignore
      from_version: v0.150.0
      id: processor.filter.defaultErrorModeIgnore
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/47232
      stage: stable
      to_version: v0.159.0
    status:
      class: processor
      codeowners:
        active:
        - TylerHelmuth
        - evan-bradley
        - edmocosta
        - bogdandrutu
        emeritus:
        - boostchicken
      distributions:
      - contrib
      - core
      - k8s
      stability:
        alpha:
        - logs
        - metrics
        - traces
        development:
        - profiles
      warnings:
      - Orphaned Telemetry
      - Other
    telemetry:
      metrics:
        processor_filter_datapoints.filtered:
          description: Number of metric data points dropped by the filter processor
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_filter_logs.filtered:
          description: Number of logs dropped by the filter processor
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_filter_profiles.filtered:
          description: Number of profiles dropped by the filter processor
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_filter_spans.filtered:
          description: Number of spans dropped by the filter processor
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
    type: filter
- name: genainormalizerprocessor
  metadata:
    display_name: GenAI Normalizer Processor
    status:
      class: processor
      codeowners:
        active:
        - TylerHelmuth
        - kylehounslow
      distributions:
      - contrib
      stability:
        alpha:
        - traces
    type: gen_ai_normalizer
- name: geoipprocessor
  metadata:
    description: The geoIP processor `geoipprocessor` enhances the attributes of a
      span, log, or metric by appending information about the geographical location
      of an IP address.
    display_name: GeoIP Processor
    status:
      class: processor
      codeowners:
        active:
        - andrzej-stencel
        - michalpristas
        - rogercoll
      distributions:
      - contrib
      stability:
        alpha:
        - logs
        - metrics
        - traces
    type: geoip
- name: groupbyattrsprocessor
  metadata:
    description: This processor re-associates spans, log records and metric datapoints
      to a *Resource* that matches with the specified attributes. As a result, all
      spans, log records or metric datapoints with the same values for the specified
      attributes are "grouped" under the same *Resource*.
    display_name: Group by Attributes Processor
    status:
      class: processor
      codeowners:
        active:
        - rnishtala-sumo
        - amdprophet
        emeritus:
        - echlebek
      distributions:
      - contrib
      - k8s
      stability:
        beta:
        - logs
        - metrics
        - traces
      warnings: []
    telemetry:
      metrics:
        processor_groupbyattrs_log_groups:
          description: Distribution of groups extracted for logs
          enabled: true
          histogram:
            value_type: int
          stability: development
          unit: '1'
        processor_groupbyattrs_metric_groups:
          description: Distribution of groups extracted for metrics
          enabled: true
          histogram:
            value_type: int
          stability: development
          unit: '1'
        processor_groupbyattrs_num_grouped_logs:
          description: Number of logs that had attributes grouped
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbyattrs_num_grouped_metrics:
          description: Number of metrics that had attributes grouped
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbyattrs_num_grouped_spans:
          description: Number of spans that had attributes grouped
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbyattrs_num_non_grouped_logs:
          description: Number of logs that did not have attributes grouped
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbyattrs_num_non_grouped_metrics:
          description: Number of metrics that did not have attributes grouped
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbyattrs_num_non_grouped_spans:
          description: Number of spans that did not have attributes grouped
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbyattrs_span_groups:
          description: Distribution of groups extracted for spans
          enabled: true
          histogram:
            value_type: int
          stability: development
          unit: '1'
    type: groupbyattrs
- name: groupbytraceprocessor
  metadata:
    display_name: Group by Trace Processor
    status:
      class: processor
      codeowners:
        active:
        - iblancasa
        emeritus:
        - jpkrohling
        seeking_new: true
      distributions:
      - contrib
      - k8s
      stability:
        beta:
        - traces
      warnings:
      - Statefulness
    telemetry:
      metrics:
        processor_groupbytrace_conf_num_traces:
          description: Maximum number of traces to hold in the internal storage
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        processor_groupbytrace_event_latency:
          description: How long the queue events are taking to be processed
          enabled: true
          histogram:
            bucket_boundaries:
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
            - 500
            - 1000
            - 2000
            - 5000
            value_type: int
          stability: development
          unit: ms
        processor_groupbytrace_incomplete_releases:
          description: Releases that are suspected to have been incomplete
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{releases}'
        processor_groupbytrace_num_events_in_queue:
          description: Number of events currently in the queue
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        processor_groupbytrace_num_traces_in_memory:
          description: Number of traces currently in the in-memory storage
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        processor_groupbytrace_spans_released:
          description: Spans released to the next consumer
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbytrace_traces_evicted:
          description: Traces evicted from the internal buffer
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        processor_groupbytrace_traces_released:
          description: Traces released to the next consumer
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
    type: groupbytrace
- name: intervalprocessor
  metadata:
    display_name: Interval Processor
    status:
      class: processor
      codeowners:
        active:
        - RichieSams
        emeritus:
        - tombrk
      distributions:
      - contrib
      - k8s
      stability:
        alpha:
        - metrics
      warnings:
      - Statefulness
    type: interval
- name: isolationforestprocessor
  metadata:
    description: The **Isolation Forest processor** adds inline, unsupervised anomaly
      detection to any OpenTelemetry Collector pipeline (traces, metrics, or logs).
      It embeds a lightweight implementation of the Isolation Forest algorithm that
      automatically learns normal behaviour from recent telemetry and tags, scores,
      or optionally drops anomalies *in‑flight* – no external ML service required.
    display_name: Isolation Forest Processor
    status:
      class: processor
      codeowners:
        active:
        - atoulme
        - aarvee11
      distributions:
      - contrib
      stability:
        alpha:
        - logs
        - metrics
        - traces
    type: isolationforest
- name: k8sattributesprocessor
  metadata:
    attributes:
      otelcol.signal:
        description: The signal type the telemetry metric is associated with
        enum:
        - logs
        - metrics
        - profiles
        - traces
        type: string
      pod_identifier:
        description: The source(s) used to identify the pod, formatted as 'from/name'
          (e.g., 'connection', 'resource_attribute/k8s.pod.ip'). Does not contain
          actual identifier values to avoid high cardinality.
        type: string
      status:
        description: The status of the pod association operation
        enum:
        - error
        - success
        type: string
    deprecated_type: k8sattributes
    description: The Kubernetes Attributes Processor allows adding k8s metadata to
      resource attributes for spans, metrics and logs.
    display_name: Kubernetes Attributes Processor
    feature_gates:
    - description: When enabled, semconv legacy attributes are disabled.
      from_version: v0.145.0
      id: processor.k8sattributes.DontEmitV0K8sConventions
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/44589
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, semconv stable attributes are enabled.
      from_version: v0.145.0
      id: processor.k8sattributes.EmitV1K8sConventions
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/44589
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, processor instances with identical configuration
        are shared across different signal type pipelines, reducing duplicate Kubernetes
        API watchers.
      from_version: v0.150.0
      id: processor.k8sattributes.ShareProcessorBetweenPipelines
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/2450
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, old formatted internal telemetry metrics are disabled.
      from_version: v0.146.0
      id: processor.k8sattributes.telemetry.disableOldFormatMetrics
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/45871
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, new formatted internal telemetry metrics are enabled.
      from_version: v0.146.0
      id: processor.k8sattributes.telemetry.enableNewFormatMetrics
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/45871
      skip_strict_validation: true
      stage: alpha
    resource_attributes:
      container.id:
        description: Container ID. Usually a UUID, as for example used to identify
          Docker containers. The UUID might be abbreviated. Requires k8s.container.restart_count.
        enabled: false
        semantic_convention:
          ref: container.md#container-id
        stability: stable
        type: string
      container.image.name:
        description: Name of the image the container was built on. Requires container.id
          or k8s.container.name.
        enabled: true
        semantic_convention:
          ref: container.md#container-image-name
        stability: stable
        type: string
      container.image.repo_digests:
        description: Repo digests of the container image as provided by the container
          runtime.
        enabled: false
        semantic_convention:
          ref: container.md#container-image-repo-digests
        stability: stable
        type: slice
      container.image.tag:
        description: Container image tag. Defaults to "latest" if not provided (unless
          digest also in image path) Requires container.id or k8s.container.name.
          Deprecated, use container.image.tags instead.
        enabled: true
        type: string
      container.image.tags:
        description: Container image tags. Defaults to "latest" if not provided (unless
          digest also in image path). Requires container.id or k8s.container.name.
        enabled: true
        semantic_convention:
          ref: container.md#container-image-tags
        stability: stable
        type: slice
      k8s.cluster.uid:
        description: Gives cluster uid identified with kube-system namespace
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-cluster-uid
        stability: stable
        type: string
      k8s.container.name:
        description: The name of the Container in a Pod template. Requires container.id.
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-container-name
        stability: stable
        type: string
      k8s.cronjob.name:
        description: The name of the CronJob.
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-cronjob-name
        stability: stable
        type: string
      k8s.cronjob.uid:
        description: The uid of the CronJob.
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-cronjob-uid
        stability: stable
        type: string
      k8s.daemonset.name:
        description: The name of the DaemonSet.
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-daemonset-name
        stability: stable
        type: string
      k8s.daemonset.uid:
        description: The UID of the DaemonSet.
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-daemonset-uid
        stability: stable
        type: string
      k8s.deployment.name:
        description: The name of the Deployment.
        enabled: true
        semantic_convention:
          ref: k8s.md#k8s-deployment-name
        stability: stable
        type: string
      k8s.deployment.uid:
        description: The UID of the Deployment.
        enabled: false
        semantic_convention:
          ref: k8s.md#k8s-deployment-uid
        stability: stable
