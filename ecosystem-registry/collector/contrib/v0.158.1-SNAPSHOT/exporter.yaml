            - 0.025
            - 0.05
            - 0.075
            - 0.1
            - 0.25
            - 0.5
            - 0.75
            - 1
            - 2.5
            - 5
            - 7.5
            - 10
            - 25
            - 50
            - 75
            - 100
            value_type: double
          stability: development
          unit: s
    type: kafka
- name: loadbalancingexporter
