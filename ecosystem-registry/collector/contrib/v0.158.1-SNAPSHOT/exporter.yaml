- name: prometheusremotewriteexporter
  metadata:
    deprecated_type: prometheusremotewrite
    display_name: Prometheus Remote Write Exporter
    feature_gates:
    - description: When enabled and settings configured, the Prometheus remote exporter
        will spawn multiple workers/goroutines to handle incoming metrics batches
        concurrently.
      from_version: v0.118.0
      id: exporter.prometheusremotewritexporter.EnableMultipleWorkers
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/36134
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, the Prometheus remote write exporter will retry 429
        http status code. Requires exporter.prometheusremotewritexporter.metrics.RetryOn429
        to be enabled.
      from_version: v0.101.0
      id: exporter.prometheusremotewritexporter.RetryOn429
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/31924
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, the Prometheus remote write exporter will support
        sending rw2. Extra configuration is still required besides enabling this feature
        gate.
      from_version: v0.125.0
      id: exporter.prometheusremotewritexporter.enableSendingRW2
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/35888
      skip_strict_validation: true
      stage: alpha
    - description: When enabled, it rejects top-level HTTP client settings (e.g. endpoint,
        tls, proxy_url); configure them under the http block instead.
      from_version: v0.158.0
      id: exporter.prometheusremotewritexporter.removeTopLevelHTTPSettings
      reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/46209
      skip_strict_validation: true
      stage: alpha
    status:
      class: exporter
      codeowners:
        active:
        - Aneurysm9
        - rapphil
        - dashpole
        - ArthurSens
        - ywwg
      distributions:
      - contrib
      - core
      stability:
        beta:
        - metrics
    telemetry:
      metrics:
        exporter_prometheusremotewrite_consumers:
          description: Number of configured workers to use to fan out the outgoing
            requests
          enabled: true
          stability: development
          sum:
            monotonic: false
            value_type: int
          unit: '{consumer}'
        exporter_prometheusremotewrite_failed_translations:
          description: Number of translation operations that failed to translate metrics
            from Otel to Prometheus
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        exporter_prometheusremotewrite_sent_batches:
          description: Number of remote write request batches sent to the remote write
            endpoint regardless of success or failure
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{batch}'
        exporter_prometheusremotewrite_translated_time_series:
          description: Number of Prometheus time series that were translated from
            OTel metrics
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        exporter_prometheusremotewrite_wal_bytes_read:
          description: Total number of bytes read from the WAL
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: By
        exporter_prometheusremotewrite_wal_bytes_written:
          description: Total number of bytes written to the WAL
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: By
        exporter_prometheusremotewrite_wal_lag:
          description: WAL lag
          enabled: true
          gauge:
            value_type: int
          stability: development
          unit: '1'
        exporter_prometheusremotewrite_wal_read_latency:
          description: Response latency in ms for the WAL reads.
          enabled: true
          histogram:
            bucket_boundaries:
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
            - 500
            - 1000
            - 2000
            - 5000
            value_type: int
          stability: development
          unit: ms
        exporter_prometheusremotewrite_wal_reads:
          description: Number of WAL reads
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        exporter_prometheusremotewrite_wal_reads_failures:
          description: Number of WAL reads that failed
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        exporter_prometheusremotewrite_wal_write_latency:
          description: Response latency in ms for the WAL writes.
          enabled: true
          histogram:
            bucket_boundaries:
            - 5
            - 10
            - 20
            - 50
            - 100
            - 200
            - 500
            - 1000
            - 2000
            - 5000
            value_type: int
          stability: development
          unit: ms
        exporter_prometheusremotewrite_wal_writes:
          description: Number of WAL writes
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        exporter_prometheusremotewrite_wal_writes_failures:
          description: Number of WAL writes that failed
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '1'
        exporter_prometheusremotewrite_written_exemplars:
          description: Number of Prometheus Exemplars that were successfully written
            to the remote write endpoint (only available when using remote write v2)
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{exemplar}'
        exporter_prometheusremotewrite_written_histograms:
          description: Number of Prometheus Histograms that were successfully written
            to the remote write endpoint (only available when using remote write v2)
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{histogram}'
        exporter_prometheusremotewrite_written_samples:
          description: Number of Prometheus Samples that were successfully written
            to the remote write endpoint (only available when using remote write v2)
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{sample}'
    type: prometheus_remote_write
