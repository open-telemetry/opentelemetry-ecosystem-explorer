distribution: core
version: 0.154.0
repository: opentelemetry-collector
component_type: processor
schema_hash: ed2f88264c14
components:
- name: batchprocessor
  metadata:
    display_name: Batch Processor
    github_project: open-telemetry/opentelemetry-collector
    status:
      class: processor
      distributions:
      - contrib
      - core
      - k8s
      stability:
        beta:
        - logs
        - metrics
        - traces
    telemetry:
      metrics:
        processor_batch_batch_send_size:
          description: Number of units in the batch
          enabled: true
          histogram:
            bucket_boundaries:
            - 10
            - 25
            - 50
            - 75
            - 100
            - 250
            - 500
            - 750
            - 1000
            - 2000
            - 3000
            - 4000
            - 5000
            - 6000
            - 7000
            - 8000
            - 9000
            - 10000
            - 20000
            - 30000
            - 50000
            - 100000
            value_type: int
          stability: development
          unit: '{unit}'
        processor_batch_batch_send_size_bytes:
          description: Number of bytes in batch that was sent. Only available on detailed
            level.
          enabled: true
          histogram:
            bucket_boundaries:
            - 10
            - 25
            - 50
            - 75
            - 100
            - 250
            - 500
            - 750
            - 1000
            - 2000
            - 3000
            - 4000
            - 5000
            - 6000
            - 7000
            - 8000
            - 9000
            - 10000
            - 20000
            - 30000
            - 50000
            - 100000
            - 200000
            - 300000
            - 400000
            - 500000
            - 600000
            - 700000
            - 800000
            - 900000
            - 1000000
            - 2000000
            - 3000000
            - 4000000
            - 5000000
            - 6000000
            - 7000000
            - 8000000
            - 9000000
            value_type: int
          stability: development
          unit: By
        processor_batch_batch_size_trigger_send:
          description: Number of times the batch was sent due to a size trigger
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{time}'
        processor_batch_metadata_cardinality:
          description: Number of distinct metadata value combinations being processed
          enabled: true
          stability: development
          sum:
            async: true
            value_type: int
          unit: '{combination}'
        processor_batch_timeout_trigger_send:
          description: Number of times the batch was sent due to a timeout trigger
          enabled: true
          stability: development
          sum:
            monotonic: true
            value_type: int
          unit: '{time}'
    type: batch
- name: memorylimiterprocessor
  metadata:
    display_name: Memory Limiter Processor
    github_project: open-telemetry/opentelemetry-collector
    status:
      class: processor
      distributions:
      - contrib
      - core
      - k8s
      stability:
        alpha:
        - profiles
        beta:
        - logs
        - metrics
        - traces
    telemetry:
      metrics:
        processor_accepted_log_records:
          deprecated:
            note: This metric is deprecated
            since: 0.110.0
          description: Number of log records successfully pushed into the next component
            in the pipeline.
          enabled: true
          stability: deprecated
          sum:
            monotonic: true
            value_type: int
          unit: '{record}'
        processor_accepted_metric_points:
