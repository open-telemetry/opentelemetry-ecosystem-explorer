# Every hook runs the tool version pinned in uv.lock or bun.lock, so local results match CI.
# Run `uv sync` and `bun install` first.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(ecosystem-automation|scripts)/

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(ecosystem-automation|scripts)/

      # --no-globs lints only the staged files instead of adding the config's `**/*.md`.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: bunx markdownlint-cli2 --no-globs --fix
        language: system
        types: [markdown]

      # Paths in vite.config.ts `fmt.ignorePatterns` are skipped even when passed explicitly.
      - id: oxfmt
        name: oxfmt (vp fmt)
        entry: bunx vp fmt --no-error-on-unmatched-pattern
        language: system
        files: \.(js|mjs|ts|tsx|css|json|yaml|yml|md)$
        # vp fmt starts its own worker pool; parallel batches from pre-commit exhaust process limits.
        require_serial: true

      - id: lint-ecosystem-explorer
        name: oxlint (ecosystem-explorer)
        entry: bash -c 'cd ecosystem-explorer && bun run lint'
        language: system
        pass_filenames: false
        files: ^ecosystem-explorer/
        stages: [pre-commit]

      - id: typecheck-ecosystem-explorer
        name: typecheck (ecosystem-explorer)
        entry: bash -c 'cd ecosystem-explorer && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^ecosystem-explorer/.*\.(ts|tsx)$
        stages: [pre-commit]

      - id: generate-schemas
        name: generate JSON schemas (ecosystem-explorer)
        entry: bash -c 'cd ecosystem-explorer && bun run generate-schemas'
        language: system
        pass_filenames: false
        files: ^ecosystem-explorer/(src/types/(collector|javaagent)\.ts|scripts/generate-schemas\.mjs)$
        stages: [pre-commit]

      # Both Go hooks only fire when .go files are staged, so contributors who
      # never touch Go do not need a Go toolchain. Those who do get a pointer to
      # the installer rather than a bare "command not found".
      - id: gofmt
        name: gofmt (golang-instrumentation-watcher)
        entry:
          bash -c 'command -v gofmt >/dev/null || { echo "gofmt not found. Install Go
          (https://go.dev/dl/) to commit changes to .go files."; exit 1; }; gofmt -l -w "$@"' --
        language: system
        files: ^ecosystem-automation/golang-instrumentation-watcher/.*\.go$
        stages: [pre-commit]

      - id: govet-golang-instrumentation-watcher
        name: go vet (golang-instrumentation-watcher)
        entry:
          bash -c 'command -v go >/dev/null || { echo "go not found. Install Go (https://go.dev/dl/)
          to commit changes to .go files."; exit 1; }; cd
          ecosystem-automation/golang-instrumentation-watcher && go vet ./...'
        language: system
        pass_filenames: false
        files: ^ecosystem-automation/golang-instrumentation-watcher/.*\.go$
        stages: [pre-commit]

      - id: add-copyright-headers
        name: add copyright headers
        entry: uv run python scripts/add_copyright.py
        language: system
        pass_filenames: false
        files: \.(py|js|mjs|ts|tsx)$
        stages: [pre-commit]
