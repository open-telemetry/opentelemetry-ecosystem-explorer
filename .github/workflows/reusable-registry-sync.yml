name: Reusable - Registry Sync

on:
  workflow_call:
    inputs:
      watcher-command:
        description: 'Command to run the ecosystem watcher (e.g. "uv run collector-watcher")'
        type: string
        required: true
      registry-path:
        description: 'Path to check for and stage changes (e.g. "ecosystem-registry/collector/")'
        type: string
        required: true
      branch-name:
        description: "The git branch name for the automated PR"
        type: string
        required: true
      pr-title:
        description: "The title for the automated PR"
        type: string
        required: true
      pr-body:
        description: "The body for the automated PR"
        type: string
        required: false
        default: |
          Automated nightly scan detected changes in registry data.
          ---

          _This PR is automatically generated by the automated registry sync workflow._
      cache-key-suffix:
        description:
          "Suffix appended to the tmp-repos cache key to prevent collisions between concurrent
          callers"
        type: string
        required: false
        default: ""
    secrets:
      OTELBOT_PRIVATE_KEY:
        description: "Private key for the otelbot GitHub App. Optional to support forks."
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Synchronize registry
    permissions:
      contents: write # Push registry updates
      pull-requests: write # Create or update PR
    runs-on: ubuntu-latest
    steps:
      - name: Detect repository type (if on a fork we use different git config)
        id: repo_check
        env:
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" == "open-telemetry/opentelemetry-ecosystem-explorer" ]; then
            echo "is_primary=true" >> $GITHUB_OUTPUT
          else
            echo "is_primary=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.repo_check.outputs.is_primary == 'true'
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure git (primary repository)
        if: steps.repo_check.outputs.is_primary == 'true'
        run: |
          .github/scripts/use-cla-approved-bot.sh

      - name: Configure git (forked repository)
        if: steps.repo_check.outputs.is_primary == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache repository clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp_repos
          key: tmp-repos-${{ inputs.cache-key-suffix }}
          restore-keys: |
            tmp-repos-${{ inputs.cache-key-suffix }}-

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHER_COMMAND: ${{ inputs.watcher-command }}
        run: $WATCHER_COMMAND

      - name: Check for inventory changes
        id: check_changes
        env:
          REGISTRY_PATH: ${{ inputs.registry-path }}
        run: |
          git add -N -- "$REGISTRY_PATH" 2>/dev/null || true
          if git diff --quiet -- "$REGISTRY_PATH" && [ -z "$(git ls-files --others --exclude-standard -- "$REGISTRY_PATH")" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN:
            ${{ steps.repo_check.outputs.is_primary == 'true' && steps.otelbot-token.outputs.token
            || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch-name }}
          PR_TITLE: ${{ inputs.pr-title }}
          PR_BODY: ${{ inputs.pr-body }}
          REGISTRY_PATH: ${{ inputs.registry-path }}
        run: |
          git add -- "$REGISTRY_PATH"

          git commit -m "Update registry inventory"

          git push -f origin "HEAD:$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Open PR already exists, updating..."
            gh pr edit "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
            # The force-push above is authenticated with GITHUB_TOKEN, which does
            # not start workflows, so CodeQL never re-runs for the new head and
            # the PR stays blocked on the "Code scanning results" merge rule.
            # Closing and reopening the PR with the otelbot App token emits a
            # `pull_request: reopened` event that re-runs the required checks
            # against the updated head.
            gh pr close "$BRANCH"
            gh pr reopen "$BRANCH"
          else
            echo "Creating new PR..."
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base main --head "$BRANCH"
          fi
