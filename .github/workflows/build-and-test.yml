name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # Checkout the repository source

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          cache: true
          cache-dependency-path: bun.lock
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run format check
        run: bun run format:check

  check-copyright-headers:
    name: Check copyright headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Check copyright headers
        run: uv run --frozen python scripts/check_copyright.py

  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run ruff check
        run: uv run ruff check ecosystem-automation scripts
      - name: Run ruff format check
        run: uv run ruff format --check ecosystem-automation scripts

  lint-go:
    name: Lint Go (gofmt, vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecosystem-automation/golang-instrumentation-watcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go-version-file and cache-dependency-path are resolved from the workspace
      # root, not the job's working-directory, so they need full paths.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ecosystem-automation/golang-instrumentation-watcher/go.mod
          cache-dependency-path: ecosystem-automation/golang-instrumentation-watcher/go.sum
      - name: Run gofmt check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.repo/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::Go files are not gofmt'd. Run 'make fmt' in ecosystem-automation/golang-instrumentation-watcher/ and commit the result."
            echo "$unformatted"
            gofmt -d $(find . -name '*.go' -not -path './.repo/*')
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...

  test-automation-golang-instrumentation-watcher:
    name: Test golang-instrumentation-watcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecosystem-automation/golang-instrumentation-watcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ecosystem-automation/golang-instrumentation-watcher/go.mod
          cache-dependency-path: ecosystem-automation/golang-instrumentation-watcher/go.sum
      - name: Build
        run: go build ./...
      # Integration tests (-tags=integration) clone upstream repos, so they stay
      # out of the PR path.
      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

  test-automation-collector-watcher:
    name: Test collector-watcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run collector-watcher tests
        run: |
          cd ecosystem-automation/collector-watcher
          uv run pytest tests/ --cov=collector_watcher --cov-report=term-missing --cov-report=json

  test-automation-java-instrumentation-watcher:
    name: Test java-instrumentation-watcher
