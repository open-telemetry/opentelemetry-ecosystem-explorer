name: Sync main to v1

on:
  push:
    branches: [main]
  workflow_dispatch:

# Git access uses a repository-scoped App token, including workflow-file writes.
permissions: {}

concurrency:
  group: sync-main-to-v1
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into v1
    if: >-
      github.repository == 'open-telemetry/opentelemetry-ecosystem-explorer' && github.ref ==
      'refs/heads/main' && vars.V1_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check App configuration
        env:
          APP_CLIENT_ID: ${{ vars.OTELBOT_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.OTELBOT_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure OTELBOT_CLIENT_ID and OTELBOT_PRIVATE_KEY. See docs/v1-sync.md."
            exit 1
          fi

      - name: Create repository-scoped token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          repositories: opentelemetry-ecosystem-explorer
          permission-contents: write
          permission-workflows: write

      - name: Checkout v1 history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Merge and push without rewriting history
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          .github/scripts/use-cla-approved-bot.sh

          merge_ref() {
            if ! git -c core.hooksPath=/dev/null merge --no-edit "$1"; then
              echo "::error::Cannot merge $1 into v1. Resolve conflicts manually; no changes were pushed."
              git diff --name-only --diff-filter=U
              git merge --abort || true
              exit 1
            fi
          }

          for attempt in 1 2 3; do
            # Fetch current tips, not the triggering SHA: queued runs can arrive out of order.
            git fetch --no-tags origin \
              refs/heads/main:refs/remotes/origin/main \
              refs/heads/v1:refs/remotes/origin/v1
            merge_ref origin/v1
            merge_ref origin/main

            if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/v1)" ]]; then
              echo "v1 already contains main."
              exit 0
            fi

            previous_v1=$(git rev-parse origin/v1)
            if git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/v1; then
              echo "Merged main into v1. Netlify deployment must be verified separately."
              exit 0
            fi

            git fetch --no-tags origin refs/heads/v1:refs/remotes/origin/v1
            if [[ "$previous_v1" == "$(git rev-parse origin/v1)" ]]; then
              echo "::error::Push rejected without a concurrent v1 update. Check App permissions and branch rules (including EasyCLA)."
              exit 1
            fi
            echo "v1 changed during attempt $attempt; merging the new tip before retrying."
          done

          echo "::error::v1 kept changing after three attempts. Retry this workflow on main."
          exit 1
